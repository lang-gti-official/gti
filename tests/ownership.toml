# GTI test-ownership map: the shared source for the verification planner
# (.codex/skills/verify-change/scripts/plan_checks.py), PR CI and reviewers.
#
# Each [[area]] maps source paths to the CTest tests that own them (T1) and to
# the downstream phases and tooling that consume their behaviour (T2). The
# selection is a lower bound: authors extend it from their own analysis of the
# changed invariant. tests/ownership_map_test.py validates this file.
#
# Fields:
#   area       unique short label
#   paths      "dir/" prefixes, exact files, or globs ("*" stays inside one
#              path segment, "**" crosses segments); each must match a
#              tracked file
#   owners     T1 CTest names, or anchored regexes ("^...") for a well-defined
#              family
#   consumers  T2 CTest names or anchored regexes
#   risk       optional: "shared" (scripts/validation_checks.py SHARED floor,
#              or an equally shared contract) or "system" (validate alone,
#              never combined with other changes)
#
# Every changed implementation path also gets the baseline that the policy
# requires of every change: `compiler_pipeline` and the native O0/O3 smoke.
# The planner adds that baseline; entries do not repeat it.

schema = 1

# Tests registered only in some configurations (platform, optional tools or
# build options). The inventory check accepts their absence from one build's
# inventory when tests/CMakeLists.txt still registers them by name.
[configuration_dependent]
reason = "registered only on some hosts or with optional tools or build options"
tests = [
  # GTI_BUILD_LSP=OFF omits these registrations.
  "block_comment_lsp",
  "comment_placement_lsp",
  "concurrency_composition_lsp",
  "diagnostic_explanations",
  "diagnostic_recovery_lsp",
  "executable_entry_cli_lsp",
  "export_placement_lsp",
  "extensible_formatting_lsp",
  "frontend_cache_invalidation",
  "include_removal_lsp",
  "lsp_code_snippets",
  "lsp_configuration",
  "lsp_include_suggestions",
  "lsp_project_facts",
  "lsp_protocol",
  "lsp_scalability_benchmark_smoke",
  "missing_definition_cli_lsp",
  "module_map_lsp",
  "module_navigation_lsp",
  "raw_pointer_audit_policy",
  "resource_protocol_lsp",
  "source_modules_lsp",
  "source_text_lsp",

  "compact_owner_layout_instrumented",
  "cpp_debug_artifacts",
  "issues_30_33_lsp",
  "llvm_atomic_wait_service",
  "llvm_mutex_service",
  "llvm_native_runtime_identity",
  "macos_installed_runtime",
  "macro_neovim_syntax",
  "neovim_lsp_configuration",
  "neovim_gtiup",
  "optimizer_coverage_growth",
  "runtime_synchronization",
  "shared_ownership_instrumented",
  "source_debug_lldb",
]


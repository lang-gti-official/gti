name: Release

# The Gitea repository is a pull mirror, so GitHub owns stable tags. Building
# only after a v* tag is mirrored avoids duplicate VERSION-triggered releases
# and avoids trying to create Git data in a read-only mirror.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve mirrored release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate mirrored release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "Mirrored release tag ${tag} does not exist" >&2
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          echo "sha=${sha}" >> "${GITEA_OUTPUT}"
          echo "version=${version}" >> "${GITEA_OUTPUT}"
          echo "tag=${tag}" >> "${GITEA_OUTPUT}"

  package:
    name: Build and test release
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact release commit
        uses: https://gitea.com/actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
        run: |
          jobs="${GTI_CONFIGURED_JOBS:-}"
          if [[ ! "${jobs}" =~ ^[1-9][0-9]*$ ]]; then
            jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || true)"
          fi
          if [[ ! "${jobs}" =~ ^[1-9][0-9]*$ ]]; then
            jobs=4
          fi
          echo "GTI_JOBS=${jobs}" >> "${GITEA_ENV}"
          if command -v sccache >/dev/null 2>&1; then
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> "${GITEA_ENV}"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "${GITEA_ENV}"
            if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
              echo "SCCACHE_GHA_ENABLED=true" >> "${GITEA_ENV}"
            fi
          fi

      - name: Resolve package platform
        id: platform
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux-x64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *)
              echo "Unsupported release runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          echo "platform=${platform}" >> "${GITEA_OUTPUT}"

      - name: Configure release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON

      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"

      - name: Test build tree
        run: >-
          ctest --test-dir build -C Release
          --parallel "${GTI_JOBS}" --output-on-failure

      - name: Stage toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-stage"
          --component gti_toolchain

      - name: Test installed toolchain
        run: |
          export PATH="${{ runner.temp }}/gti-stage/bin:${PATH}"
          cd "${{ runner.temp }}"
          python3 "${{ gitea.workspace }}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${{ gitea.workspace }}/tests/cli_smoke_test.py" gti
          python3 "${{ gitea.workspace }}/tests/project_cli_smoke_test.py" gti
          cmake \
            -S "${{ gitea.workspace }}/tests/installed_library_smoke" \
            -B "${{ runner.temp }}/gti-installed-library-smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-stage"
          cmake --build \
            "${{ runner.temp }}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest \
            --test-dir "${{ runner.temp }}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_JOBS}" --output-on-failure

      - name: Create release archive
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ gitea.workspace }}
          -DGTI_STAGE_DIR=${{ runner.temp }}/gti-stage
          -DGTI_OUTPUT_DIR=${{ gitea.workspace }}/dist
          -DGTI_PLATFORM=${{ steps.platform.outputs.platform }}
          -DGTI_EXPECTED_TAG=${{ needs.metadata.outputs.tag }}
          -P cmake/PackageRelease.cmake

      - name: Upload release archive
        uses: https://gitea.com/actions/upload-artifact@v3
        with:
          name: gti-release-package
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Gitea release
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    permissions:
      code: read
      releases: write

    steps:
      - name: Check out packaged commit
        uses: https://gitea.com/actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Verify mirrored release tag
        shell: bash
        env:
          GTI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          GTI_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          git fetch --force origin "+refs/tags/${GTI_RELEASE_TAG}:refs/tags/${GTI_RELEASE_TAG}"
          current="$(git rev-parse "refs/tags/${GTI_RELEASE_TAG}^{commit}")"
          if [[ "${current}" != "${GTI_RELEASE_SHA}" ]]; then
            echo "${GTI_RELEASE_TAG} moved to ${current}; refusing mismatched artifacts" >&2
            exit 1
          fi

      - name: Download release archive
        uses: https://gitea.com/actions/download-artifact@v3
        with:
          name: gti-release-package
          path: dist

      - name: Verify downloaded assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

      - name: Publish release
        uses: https://gitea.com/actions/gitea-release-action@v1
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.sha }}
          name: GTI ${{ needs.metadata.outputs.tag }}
          prerelease: false
          files: |
            dist/*

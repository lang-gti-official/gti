name: Nightly

# Gitea main is the source of truth. Each admitted main commit is packaged, then
# the mutable `nightly` tag and release are advanced only if that commit is still
# the current main head.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve nightly source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.nightly.outputs.sha }}
      version: ${{ steps.nightly.outputs.version }}

    steps:
      - name: Check out triggering commit
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ gitea.sha }}

      - name: Resolve nightly metadata
        id: nightly
        shell: bash
        env:
          GTI_EVENT_SHA: ${{ gitea.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "${sha}" != "${GTI_EVENT_SHA}" ]]; then
            echo "Checked-out commit does not match the triggering Gitea revision" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITEA_OUTPUT}"
          echo "version=${version}" >> "${GITEA_OUTPUT}"

  package:
    name: Build and test nightly
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Check out exact nightly commit
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            build-essential clang cmake ninja-build

      - name: Install CMake and Ninja
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Resolve package platform
        id: platform
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux-x64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *)
              echo "Unsupported release runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          echo "platform=${platform}" >> "${GITEA_OUTPUT}"

      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --sanitizer thread --sanitizer address,undefined

      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON

      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"

      - name: Test build tree
        run: >-
          ctest --test-dir build -C Release
          --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Stage toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-stage"
          --component gti_toolchain

      - name: Test installed toolchain
        run: |
          export PATH="${{ runner.temp }}/gti-stage/bin:${PATH}"
          cd "${{ runner.temp }}"
          python3 "${{ gitea.workspace }}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${{ gitea.workspace }}/tests/cli_smoke_test.py" gti
          python3 "${{ gitea.workspace }}/tests/project_cli_smoke_test.py" gti
          python3 "${{ gitea.workspace }}/tests/managed_thread_runtime_test.py" gti
          python3 "${{ gitea.workspace }}/tests/atomic_runtime_test.py" gti \
            "${{ gitea.workspace }}/tests/fixtures/atomic_scalar.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_concurrent.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_orders.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_fetch.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake \
            -S "${{ gitea.workspace }}/tests/installed_library_smoke" \
            -B "${{ runner.temp }}/gti-installed-library-smoke" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-stage"
          cmake --build \
            "${{ runner.temp }}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest \
            --test-dir "${{ runner.temp }}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Create nightly archive
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ gitea.workspace }}
          -DGTI_STAGE_DIR=${{ runner.temp }}/gti-stage
          -DGTI_OUTPUT_DIR=${{ gitea.workspace }}/dist
          -DGTI_PLATFORM=${{ steps.platform.outputs.platform }}
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID=${{ needs.metadata.outputs.sha }}
          -P cmake/PackageRelease.cmake

      - name: Record nightly build identity
        run: printf '%s\n' '${{ needs.metadata.outputs.sha }}' > dist/BUILD_ID

      - name: Upload nightly archive
        uses: https://gitea.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: gti-nightly-package
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Gitea nightly release
    needs:
      - metadata
      - package
    runs-on: ubuntu-24.04
    permissions:
      code: write
      releases: write

    steps:
      - name: Check out packaged commit
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Refuse to publish a superseded nightly
        shell: bash
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          current="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
          if [[ "${current}" != "${GTI_NIGHTLY_SHA}" ]]; then
            echo "Nightly moved to ${current}; refusing to publish stale artifacts" >&2
            exit 1
          fi

      - name: Advance the nightly tag
        shell: bash
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          git tag --force nightly "${GTI_NIGHTLY_SHA}"
          git push --force origin refs/tags/nightly

      - name: Download nightly archive
        uses: https://gitea.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: gti-nightly-package
          path: dist

      - name: Verify downloaded assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No nightly assets were downloaded" >&2
            exit 1
          fi

      - name: Publish nightly release
        uses: https://gitea.com/actions/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: nightly
          target_commitish: ${{ needs.metadata.outputs.sha }}
          name: GTI nightly
          prerelease: true
          body: |
            Rolling build of Gitea `main`.

            - commit: `${{ needs.metadata.outputs.sha }}`
            - version at build: `${{ needs.metadata.outputs.version }}`

            Use a versioned release for anything that needs to stay put.
          files: |
            dist/*

      - name: Remove assets outside this nightly build
        env:
          GTI_GITEA_TOKEN: ${{ gitea.token }}
        run: >-
          python3 scripts/sync_gitea_release_assets.py
          --api-url "${{ gitea.api_url }}"
          --repository "${{ gitea.repository }}"
          --tag nightly
          --asset-directory dist

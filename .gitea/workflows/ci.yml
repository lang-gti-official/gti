name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned clang-format
        run: |
          python3 -m venv .format-tools
          .format-tools/bin/pip install "clang-format==$(cat .clang-format-version)"

      - name: Verify first-party C and C++ formatting
        env:
          GTI_CLANG_FORMAT: .format-tools/bin/clang-format
        run: python3 scripts/clang_format.py --check

  release-version:
    name: Release version
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped tooling changes
        env:
          GTI_BASE_SHA: ${{ gitea.event_name == 'pull_request' && gitea.event.pull_request.base.sha || gitea.event.before }}
          GTI_HEAD_SHA: ${{ gitea.sha }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_release_version.py "${base}" "${GTI_HEAD_SHA}"

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti

      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          npm run test:shipped
          npm run test:source-text
          git diff --exit-code -- src

  reference:
    name: Reference site
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Ninja, LLVM 18, libclang, and Clang
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            clang cmake libclang-18-dev llvm-18-dev ninja-build
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Configure runner resources
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
        run: bash scripts/configure_ci_resources.sh

      - name: Configure reference tools
        run: >-
          cmake -S . -B build-reference -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_BUILD_LSP=OFF
          -DBUILD_TESTING=OFF

      - name: Build compiler-backed reference tools
        run: >-
          cmake --build build-reference --config Release --parallel "${GTI_JOBS}"
          --target gti_docgen gti

      - name: Install pinned pnpm
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/gti-pnpm" pnpm@11.23.0
          echo "${RUNNER_TEMP}/gti-pnpm/bin" >> "${GITEA_PATH}"

      - name: Install reference dependencies
        working-directory: reference
        run: pnpm install --frozen-lockfile

      - name: Generate compiler API index
        working-directory: reference
        run: pnpm api:generate -- --docgen ../build-reference/gti_docgen

      - name: Verify content contract and examples
        working-directory: reference
        run: |
          pnpm test
          pnpm examples:verify -- --gti ../build-reference/gti
          pnpm examples:contract-smoke -- --gti ../build-reference/gti

      - name: Build static reference
        working-directory: reference
        run: |
          pnpm typecheck
          pnpm build

  build-and-test:
    name: Native toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, LLVM 18, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            build-essential clang cmake ninja-build llvm-18-dev libclang-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Install Ninja and LLVM 22
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --sanitizer thread --sanitizer address,undefined

      - name: Configure
        # Same native compiler used by the default GTI/CTest runtime probes.
        # The preflight below must pass; failures are not converted into skips.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"

      - name: Test
        run: >-
          ctest --test-dir build -C Release
          --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Stage system-LLVM toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-system-stage"
          --component gti_toolchain

      - name: Test installed libraries with system LLVM
        run: |
          cmake \
            -S tests/installed_library_smoke \
            -B "${{ runner.temp }}/gti-system-library-smoke" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-system-stage"
          cmake --build \
            "${{ runner.temp }}/gti-system-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest \
            --test-dir "${{ runner.temp }}/gti-system-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure

  compiler-sanitizers:
    name: Compiler sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, LLVM 18, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            build-essential clang cmake ninja-build libclang-rt-18-dev llvm-18-dev libclang-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Install Ninja and LLVM 22
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "${GITEA_ENV}"
          echo "$(brew --prefix llvm@22)/bin" >> "${GITEA_PATH}"

      - name: Check compiler sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx clang++ --sanitizer address,undefined

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGTI_BUILD_LSP=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitized --parallel "${GTI_JOBS}"

      - name: Test compiler and driver libraries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized --output-on-failure
          --parallel "${GTI_TEST_JOBS}"
          -R 'compiler_library_boundary|driver_library_boundary|driver_pipeline|project_model|compiler_pipeline|optimizer_foundation|raw_pointer_pipeline|failure_metadata|mir_program_initialization|mir_hosted_startup|mir_backend_first_family$|mir_backend_scalar_cfg$|mir_backend_scalar_direct_call$|mir_backend_class_default_cleanup$|mir_backend_owned_lifecycle$|mir_backend_scalar_failure_callgraph$|cpp_mir_body_emitter|cpp_mir_program_plan|cpp_mir_representation_snapshot'

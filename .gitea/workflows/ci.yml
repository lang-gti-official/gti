name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned clang-format
        run: |
          python3 -m venv .format-tools
          .format-tools/bin/pip install "clang-format==$(cat .clang-format-version)"

      - name: Verify first-party C and C++ formatting
        env:
          GTI_CLANG_FORMAT: .format-tools/bin/clang-format
        run: python3 scripts/clang_format.py --check

  release-version:
    name: Release version
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped tooling changes
        env:
          GTI_BASE_SHA: ${{ gitea.event_name == 'pull_request' && gitea.event.pull_request.base.sha || gitea.event.before }}
          GTI_HEAD_SHA: ${{ gitea.sha }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_release_version.py "${base}" "${GTI_HEAD_SHA}"

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti

      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          npm run test:shipped
          npm run test:source-text
          git diff --exit-code -- src

  build-and-test:
    name: Native toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, LLVM 18, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            build-essential ccache clang cmake ninja-build libcurl4-openssl-dev llvm-18-dev libclang-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Install Ninja and LLVM 22
        if: runner.os == 'macOS'
        run: |
          brew install ccache ninja llvm@22
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/native
        run: bash scripts/configure_ci_cache.sh

      - name: Restore compiler object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: https://gitea.com/actions/cache/restore@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2 # v4.1.0, cache service v1
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ gitea.sha }}-${{ gitea.run_id }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-

      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --sanitizer address,undefined

      - name: Configure
        # This Docker runner executes ASan/UBSan but cannot host TSAN's shadow
        # mapping. A compatible dedicated runner should leave TSAN enabled.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF

      - name: Check native driver compilation before the full build
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o

      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"

      - name: Build compiler documentation producer in the native build tree
        run: cmake --build build --config Release --parallel "${GTI_JOBS}" --target gti_docgen

      - name: Verify deterministic API generation with the native build
        run: |
          build/gti_docgen --stdlib stdlib --output build/documentation-index.json
          build/gti_docgen --stdlib stdlib --output build/documentation-index-repeat.json
          cmp build/documentation-index.json build/documentation-index-repeat.json

      - name: Test
        run: >-
          ctest --test-dir build -C Release
          --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Stage system-LLVM toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-system-stage"
          --component gti_toolchain

      - name: Test installed libraries with system LLVM
        run: |
          cmake \
            -S tests/installed_library_smoke \
            -B "${{ runner.temp }}/gti-system-library-smoke" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-system-stage"
          cmake --build \
            "${{ runner.temp }}/gti-system-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest \
            --test-dir "${{ runner.temp }}/gti-system-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Save compiler object cache, including partial builds
        if: always() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: https://gitea.com/actions/cache/save@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  compiler-sanitizers:
    name: Compiler sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, LLVM 18, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            build-essential ccache clang cmake ninja-build libcurl4-openssl-dev libclang-rt-18-dev llvm-18-dev libclang-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITEA_ENV}"

      - name: Install Ninja and LLVM 22
        if: runner.os == 'macOS'
        run: |
          brew install ccache ninja llvm@22
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "${GITEA_ENV}"
          echo "$(brew --prefix llvm@22)/bin" >> "${GITEA_PATH}"

      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/sanitizers
        run: bash scripts/configure_ci_cache.sh

      - name: Restore compiler object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: https://gitea.com/actions/cache/restore@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2 # v4.1.0, cache service v1
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ gitea.sha }}-${{ gitea.run_id }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-

      - name: Check compiler sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx clang++ --sanitizer address,undefined

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGTI_BUILD_LSP=OFF
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitized --parallel "${GTI_JOBS}"

      - name: Test compiler and driver libraries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized --output-on-failure
          --parallel "${GTI_TEST_JOBS}"
          -R 'compiler_library_boundary|driver_library_boundary|driver_pipeline|project_model|compiler_pipeline|optimizer_foundation|raw_pointer_pipeline|failure_metadata|mir_program_initialization|mir_hosted_startup|mir_backend_first_family$|mir_backend_scalar_cfg$|mir_backend_scalar_direct_call$|mir_backend_class_default_cleanup$|mir_backend_owned_lifecycle$|mir_backend_scalar_failure_callgraph$|cpp_mir_body_emitter|cpp_mir_program_plan|cpp_mir_representation_snapshot'

      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Save compiler object cache, including partial builds
        if: always() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: https://gitea.com/actions/cache/save@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

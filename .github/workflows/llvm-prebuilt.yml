name: Prebuilt LLVM

# Builds the pinned bundled LLVM/Clang objects once per (LLVM version,
# platform, compiler, CMake inputs) and saves them as a main-scoped ccache
# keyed by that tuple, never by commit. Release packaging and the integration
# shards restore it, so a merge no longer rebuilds LLVM 20.1.0 plus Clang from
# source (86 minutes on Linux, 65 on macOS, with a 0.2% object-cache hit
# rate when the key carried the SHA). The LLVM source is the same pinned,
# hash-verified tarball CMakeLists.txt fetches; only the compile is reused.
on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - "cmake/**"
      - scripts/configure_ci_toolchain.sh
      - scripts/configure_ci_cache.sh
      - .github/workflows/llvm-prebuilt.yml
  schedule:
    - cron: "41 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer toolchain definition supersedes an older warm; the key is
  # content-derived so a superseded run saved nothing a later run needs.
  group: gti-llvm-prebuilt
  cancel-in-progress: true

jobs:
  warm:
    name: Prebuild LLVM/Clang (${{ matrix.platform }})
    if: github.repository == 'lang-gti-official/gti'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, host: Linux-X64}
          - {os: macos-26, platform: darwin-arm64, host: macOS-ARM64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the current release cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
      - name: Configure release build
        if: steps.cache.outputs.cache-hit != 'true'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Build the bundled LLVM/Clang and the compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      - name: Save the release cache under main
        if: always() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}

name: C++ backend

# The C++ backend is frozen and separated from default builds, tests and CI
# (docs/decisions/031-native-llvm-backend-foundation.md). It is built only with
# the GTI_ENABLE_CPP_BACKEND CMake option. This workflow is the one place that still
# builds and tests it, and only when dispatched by hand: it never runs on a
# schedule, never gates a change, never opens an issue and never blocks a
# channel. It runs every runtime harness with GTI_TEST_BACKENDS=cpp, the
# C++-only CTest entries, and the emitter under ASan/UBSan.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gti-cpp-backend
  cancel-in-progress: false

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Dispatched by hand on main or on the branch of a C++ backend fix.
      - name: Select the full C++ run
        id: plan
        run: echo 'mode=full' >> "${GITHUB_OUTPUT}"

  suite:
    name: C++ backend suite (${{ matrix.index }}/${{ matrix.shards }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shards: 4, index: 0}
          - {os: ubuntu-24.04, platform: linux, shards: 4, index: 1}
          - {os: ubuntu-24.04, platform: linux, shards: 4, index: 2}
          - {os: ubuntu-24.04, platform: linux, shards: 4, index: 3}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      GTI_TEST_BACKENDS: cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the prebuilt LLVM/Clang and release object cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure release build
        # The backend policy is a configure-time cache variable: every CTest
        # entry carries GTI_TEST_BACKENDS in its ENVIRONMENT property, which
        # overrides the job environment, so the job's env alone would run the
        # shipped backend's modes (as the first scheduled run did).
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_ENABLE_CPP_BACKEND=ON
          -DGTI_TEST_BACKENDS=cpp
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Run this shard of the C++ backend suite
        env:
          GTI_SHARDS: ${{ matrix.shards }}
          GTI_SHARD_INDEX: ${{ matrix.index }}
        run: >-
          python3 scripts/validation_checks.py shard --build build --test-set cpp
          --shards "${GTI_SHARDS}" --index "${GTI_SHARD_INDEX}"
          --jobs "${GTI_TEST_JOBS}"
          --report "${RUNNER_TEMP}/shard/cpp-${GTI_SHARD_INDEX}.json"
          --log "${RUNNER_TEMP}/shard/cpp-${GTI_SHARD_INDEX}.log"
      - name: Show the shard log on failure
        if: failure()
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
        run: tail -n 400 "${RUNNER_TEMP}/shard/cpp-${GTI_SHARD_INDEX}.log" || true
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-shard-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/shard/*.json
            ${{ runner.temp }}/shard/*.xml
          retention-days: 30
          if-no-files-found: ignore

  emitter-sanitizers:
    name: C++ emitter sanitizers (${{ matrix.index }}/2)
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # The C++ emitter's own tests under ASan/UBSan: the only place the
      # deprecated backend is instrumented.
      GTI_SANITIZER_TESTS: 'cpp_mir_body_emitter_(preflight|text|lifecycle|census|corpus_protocol)$|cpp_mir_program_plan|cpp_mir_representation_snapshot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 8192
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/sanitizers
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-sanitizers-${{ runner.os }}-${{ runner.arch }}-
      - name: Check compiler sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGTI_BUILD_LSP=OFF
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_ENABLE_CPP_BACKEND=ON
          -DGTI_TEST_BACKENDS=cpp
          -DGTI_TEST_TIMEOUT_SCALE=6
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link
      - name: Build the targets the emitter subset runs
        run: |
          targets="$(python3 scripts/validation_checks.py test-targets --build build-sanitized --regex "${GTI_SANITIZER_TESTS}")"
          read -r -a target_list <<< "${targets}"
          cmake --build build-sanitized --parallel "${GTI_JOBS}" --target "${target_list[@]}"
      - name: Test the emitter libraries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized --verbose --output-on-failure --no-tests=error
          --output-junit "${RUNNER_TEMP}/cpp-sanitizers-${{ matrix.index }}.xml"
          --parallel "${GTI_TEST_JOBS}" -R "${GTI_SANITIZER_TESTS}"
          -E '^cpp_mir_body_emitter_lifecycle$' -I "${{ matrix.index }},,2"
      - name: Test named lifecycle cases
        if: ${{ !cancelled() }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python3 scripts/named_test_shards.py run
          --executable build-sanitized/gti_cpp_mir_body_emitter_lifecycle_tests
          --index "${{ matrix.index }}" --count 2 --timeout 5400
          --source "${{ github.sha }}"
          --report "${RUNNER_TEMP}/lifecycle-${{ matrix.index }}.json"
      - name: Preserve sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-sanitizers-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/cpp-sanitizers-${{ matrix.index }}.xml
            ${{ runner.temp }}/lifecycle-${{ matrix.index }}.json
          if-no-files-found: warn
          retention-days: 30

  verdict:
    name: C++ backend verdict
    if: always()
    needs: [plan, suite, emitter-sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect lifecycle sanitizer evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpp-sanitizers-*
          path: ${{ runner.temp }}/lifecycle-shards
      - name: Require every lifecycle sanitizer case
        run: >-
          python3 scripts/named_test_shards.py verify
          --reports "${RUNNER_TEMP}/lifecycle-shards"
          --source "${{ github.sha }}" --count 2
      - name: Decide
        env:
          GTI_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["GTI_RESULTS"])
          failed = [k for k in ("suite", "emitter-sanitizers") if results[k]["result"] != "success"]
          print("C++ backend:", "passed" if not failed else "failed: " + ", ".join(failed))
          sys.exit(1 if failed else 0)
          PY

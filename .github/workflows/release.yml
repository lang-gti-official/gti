name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Validate release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  package:
    name: Package ${{ matrix.platform }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Configure release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test build tree
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-stage"
          --component gti_toolchain

      - name: Test installed toolchain
        run: |
          export PATH="${{ runner.temp }}/gti-stage/bin:${PATH}"
          cd "${{ runner.temp }}"
          python3 "${{ github.workspace }}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${{ github.workspace }}/tests/cli_smoke_test.py" gti
          python3 "${{ github.workspace }}/tests/project_cli_smoke_test.py" gti
          cmake \
            -S "${{ github.workspace }}/tests/installed_library_smoke" \
            -B "${{ runner.temp }}/gti-installed-library-smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-stage"
          cmake --build \
            "${{ runner.temp }}/gti-installed-library-smoke" \
            --config Release
          ctest \
            --test-dir "${{ runner.temp }}/gti-installed-library-smoke" \
            -C Release --output-on-failure

      - name: Create release archive
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ github.workspace }}
          -DGTI_STAGE_DIR=${{ runner.temp }}/gti-stage
          -DGTI_OUTPUT_DIR=${{ github.workspace }}/dist
          -DGTI_PLATFORM=${{ matrix.platform }}
          -DGTI_EXPECTED_TAG=${{ needs.metadata.outputs.tag }}
          -P cmake/PackageRelease.cmake

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: gti-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gti-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GTI ${{ needs.metadata.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

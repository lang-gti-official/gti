name: Toolchain release

# One bundled build per main commit and platform supplies nightly and, on
# VERSION changes, stable. Manual dispatch retains the exact-commit stable
# rebuild contract. GitHub-hosted Linux and macOS runners each package their
# native platform, so the Neovim plugin can install either from a release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: toolchain-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}

    steps:
      - name: Check out GTI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify release orchestration before compiling
        run: python3 tests/ci_release_test.py .

      - name: Resolve exact source and release channels
        id: release
        shell: bash
        env:
          GTI_EVENT_SHA: ${{ github.sha }}
          GTI_EVENT_NAME: ${{ github.event_name }}
          GTI_EVENT_BEFORE: ${{ github.event.before }}
        run: >-
          python3 scripts/resolve_release_source.py source
          --sha "${GTI_EVENT_SHA}" --event "${GTI_EVENT_NAME}"
          --before "${GTI_EVENT_BEFORE}" --output "${GITHUB_OUTPUT}"

  package:
    name: Build and test shared release toolchain (${{ matrix.platform }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # The bundled LLVM/Clang build compiles its large units beside
          # GTI's; running one per processor exhausted a runner's memory.
          GTI_MEMORY_PER_JOB_MIB: 3072
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang cmake ninja-build libcurl4-openssl-dev

      - name: Install CMake and Ninja
        if: runner.os == 'macOS'
        run: brew install ccache cmake ninja

      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh

      - name: Restore compiler and LLVM/Clang object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --sanitizer address,undefined

      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF

      - name: Check native driver compilation before LLVM/Clang
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o

      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"

      - name: Test build tree
        run: >-
          ctest --test-dir build -C Release
          --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Allocate a fresh staging directory
        env:
          GTI_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          stage="$(mktemp -d "${GTI_RUNNER_TEMP}/gti-stage.XXXXXXXX")"
          printf 'GTI_STAGE_DIRECTORY=%s\n' "${stage}" >> "${GITHUB_ENV}"

      - name: Stage toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${GTI_STAGE_DIRECTORY}"
          --component gti_toolchain

      - name: Test installed toolchain
        run: |
          export PATH="${GTI_STAGE_DIRECTORY}/bin:${PATH}"
          cd "${{ runner.temp }}"
          python3 "${{ github.workspace }}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${{ github.workspace }}/tests/cli_smoke_test.py" gti
          python3 "${{ github.workspace }}/tests/project_cli_smoke_test.py" gti
          python3 "${{ github.workspace }}/tests/process_resource_policy_test.py" gti --installed
          python3 "${{ github.workspace }}/tests/managed_thread_runtime_test.py" gti
          python3 "${{ github.workspace }}/tests/atomic_runtime_test.py" gti \
            "${{ github.workspace }}/tests/fixtures/atomic_scalar.gti" \
            "${{ github.workspace }}/tests/fixtures/atomic_concurrent.gti" \
            "${{ github.workspace }}/tests/fixtures/atomic_orders.gti" \
            "${{ github.workspace }}/tests/fixtures/atomic_fetch.gti" \
            "${{ github.workspace }}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake \
            -S "${{ github.workspace }}/tests/installed_library_smoke" \
            -B "${{ runner.temp }}/gti-installed-library-smoke" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GTI_STAGE_DIRECTORY}"
          cmake --build \
            "${{ runner.temp }}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest \
            --test-dir "${{ runner.temp }}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Create release archive
        if: needs.metadata.outputs.stable == 'true'
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ github.workspace }}
          -DGTI_STAGE_DIR=${{ env.GTI_STAGE_DIRECTORY }}
          -DGTI_OUTPUT_DIR=${{ github.workspace }}/dist/stable
          -DGTI_PLATFORM=${{ matrix.platform }}
          -DGTI_EXPECTED_TAG=${{ needs.metadata.outputs.tag }}
          -P cmake/PackageRelease.cmake

      - name: Upload release archive
        if: needs.metadata.outputs.stable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-release-package-${{ matrix.platform }}
          path: dist/stable/*
          if-no-files-found: error
          retention-days: 1

      # Stable is archived first; only nightly stamps BUILD_ID into the stage.
      - name: Create nightly archive from the same validated stage
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ github.workspace }}
          -DGTI_STAGE_DIR=${{ env.GTI_STAGE_DIRECTORY }}
          -DGTI_OUTPUT_DIR=${{ github.workspace }}/dist/nightly
          -DGTI_PLATFORM=${{ matrix.platform }}
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID=${{ needs.metadata.outputs.sha }}
          -P cmake/PackageRelease.cmake

      - name: Record nightly build identity
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: printf '%s\n' "${GTI_NIGHTLY_SHA}" > dist/nightly/BUILD_ID

      - name: Upload nightly archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-package-${{ matrix.platform }}
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 1

      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Save compiler and LLVM/Clang cache, including partial builds
        if: always() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  publish-stable:
    name: Publish GitHub release
    if: needs.metadata.outputs.stable == 'true'
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out packaged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Refuse a conflicting release tag
        shell: bash
        env:
          GTI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          GTI_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${GTI_RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "+refs/tags/${GTI_RELEASE_TAG}:refs/tags/${GTI_RELEASE_TAG}"
            current="$(git rev-parse "refs/tags/${GTI_RELEASE_TAG}^{commit}")"
            if [[ "${current}" != "${GTI_RELEASE_SHA}" ]]; then
              echo "${GTI_RELEASE_TAG} names ${current}; refusing mismatched artifacts" >&2
              exit 1
            fi
          fi

      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gti-release-package-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GTI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          GTI_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          notes="$(mktemp)"
          cat > "${notes}" <<EOF
          Stable GTI toolchain built from \`${GTI_RELEASE_SHA}\`.

          This immutable release is published by the authoritative GitHub workflow.
          EOF
          if gh release view "${GTI_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # An exact-commit manual rebuild refreshes the assets of the
            # existing release; the tag check above already proved identity.
            gh release upload "${GTI_RELEASE_TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GTI_RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" \
              --target "${GTI_RELEASE_SHA}" --title "GTI ${GTI_RELEASE_TAG}" --notes-file "${notes}"
          fi

  publish-nightly:
    name: Publish GitHub nightly release
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    concurrency:
      group: gti-nightly-publication
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out packaged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Download nightly archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gti-nightly-package-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No nightly assets were downloaded" >&2
            exit 1
          fi

      - name: Admit only the current main commit
        id: admission
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: >-
          python3 scripts/resolve_release_source.py admit-nightly
          --sha "${GTI_NIGHTLY_SHA}" --output "${GITHUB_OUTPUT}"

      - name: Advance the nightly tag
        if: steps.admission.outputs.publish == 'true'
        shell: bash
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          git tag --force nightly "${GTI_NIGHTLY_SHA}"
          git push --force origin refs/tags/nightly

      - name: Publish nightly release
        if: steps.admission.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
          GTI_NIGHTLY_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          notes="$(mktemp)"
          cat > "${notes}" <<EOF
          Rolling build of GitHub \`main\`.

          - commit: \`${GTI_NIGHTLY_SHA}\`
          - version at build: \`${GTI_NIGHTLY_VERSION}\`

          Use a versioned release for anything that needs to stay put.
          EOF
          if gh release view nightly --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit nightly --repo "${GITHUB_REPOSITORY}" --prerelease \
              --title "GTI nightly" --notes-file "${notes}"
            # Current assets are uploaded before anything stale is pruned.
            gh release upload nightly dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create nightly dist/* --repo "${GITHUB_REPOSITORY}" --prerelease \
              --target "${GTI_NIGHTLY_SHA}" --title "GTI nightly" --notes-file "${notes}"
          fi

      - name: Remove assets outside this nightly build
        if: steps.admission.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/sync_release_assets.py
          --repository "${GITHUB_REPOSITORY}"
          --tag nightly
          --asset-directory dist

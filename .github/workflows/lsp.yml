name: LSP components
on:
  push:
    branches: [main]
  workflow_run:
    # CI supplies merge-queue source-stdlib/LSP lane packages; Full validation
    # supplies the complete packages of each main head.
    workflows: [CI, Full validation]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gti-lsp-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lang-gti-official/gti' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'merge_group' || github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Select successful integration already on main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lsp_component.py select --plan lsp-plan.json
      - name: Download exact admitted packages
        if: steps.source.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: gti-nightly-*-${{ steps.source.outputs.attempt }}
          path: packages
          merge-multiple: true
      - name: Verify and package compatible LSPs without rebuilding
        if: steps.source.outputs.available == 'true'
        run: python3 scripts/lsp_component.py pack --plan lsp-plan.json --directory packages --output components
      - name: Attest component archives
        if: steps.source.outputs.available == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: components/gti-lsp-*.tar.gz
      - name: Publish immutable compatible updates
        if: steps.source.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lsp_component.py publish --plan lsp-plan.json --directory components

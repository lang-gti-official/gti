name: CI

# One required check, "CI gate". A pull request proves its fast checks before
# it may enter the merge queue; the queue then proves the complete suite on the
# exact candidate that becomes main. Contributors run focused checks locally
# and never repeat the complete suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes a PR's run; queue candidates are never cancelled by
  # one another.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify candidate without weakening its merge gate
        id: plan
        env:
          GTI_EVENT_PATH: ${{ github.event_path }}
          GTI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [[ -z "${GTI_EVENT_PATH}" || ! -f "${GTI_EVENT_PATH}" ]]; then
            echo "The event payload must name an existing file." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
            echo 'mode=full' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse origin/main)"
          fi
          python3 scripts/validation_checks.py ci-mode \
            --event "${GTI_EVENT_PATH}" --base "${base}" >> "${GITHUB_OUTPUT}"
      - name: Check the declared T0/T1 tests
        if: github.event_name == 'pull_request' && steps.plan.outputs.mode == 'full'
        env:
          GTI_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/validation_checks.py declared --event "${GTI_EVENT_PATH}"

  automation-tests:
    name: Workflow regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install workflow test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make
      - name: Verify workflow, batch, preservation and resource rules
        run: |
          git config --global user.name "GTI CI"
          git config --global user.email "ci@example.invalid"
          python3 tests/agent_workflow_test.py
          python3 tests/preview_workflow_test.py
          python3 tests/rollup_test.py
          python3 tests/build_window_test.py
          python3 tests/bounded_log_test.py
          python3 tests/release_version_test.py scripts/check_release_version.py
          python3 tests/cut_release_test.py
          python3 tests/release_train_test.py
          python3 tests/ci_release_test.py .
          python3 tests/preview_release_test.py
          python3 tests/ci_resources_test.py scripts/configure_ci_resources.sh
          python3 tests/repository_hosting_test.py .
          python3 tests/ownership_map_test.py
          python3 tests/plan_checks_test.py
          python3 tests/named_test_shards_test.py

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned clang-format
        run: |
          python3 -m venv .format-tools
          .format-tools/bin/pip install "clang-format==$(cat .clang-format-version)"
      - name: Verify first-party C and C++ formatting
        env:
          GTI_CLANG_FORMAT: .format-tools/bin/clang-format
        run: python3 scripts/clang_format.py --check

  release-version:
    name: Release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a version decision for shipped tooling changes
        env:
          GTI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GTI_HEAD_SHA: ${{ github.sha }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          # Judge the candidate from where it forked, not from a main that has
          # advanced past it.
          base="$(git merge-base "${base}" "${GTI_HEAD_SHA}")"
          python3 scripts/check_release_version.py "${base}" "${GTI_HEAD_SHA}"

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti
      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          npm run test:shipped
          npm run test:source-text
          git diff --exit-code -- src

  fast:
    name: Fast checks (${{ matrix.platform }})
    if: needs.plan.outputs.mode == 'full'
    needs: [plan, automation-tests, formatting, release-version, tree-sitter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: macos-26, platform: darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 2048
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/native
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Build
        # Keep going after a failure so one run reports every compile error.
        run: cmake --build build --parallel "${GTI_JOBS}" -- -k 0
      - name: Run fast feedback and compiler pipeline
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          --parallel "${GTI_TEST_JOBS}" -L feedback-fast
          && ctest --test-dir build --output-on-failure --no-tests=error -R '^compiler_pipeline$'
      - name: Re-run the tests this pull request declares
        if: github.event_name == 'pull_request'
        # The body is untrusted: the script validates every name and passes
        # them to CTest as an escaped, anchored pattern, never through a shell.
        env:
          GTI_EVENT_PATH: ${{ github.event_path }}
        run: >-
          python3 scripts/validation_checks.py declared --event "${GTI_EVENT_PATH}"
          --build build --jobs "${GTI_TEST_JOBS}"
      - name: Test the installed toolchain against system LLVM
        if: matrix.platform == 'linux'
        run: |
          cmake --install build --config Release --prefix "${RUNNER_TEMP}/gti-system-stage" --component gti_toolchain
          cmake -S tests/installed_library_smoke -B "${RUNNER_TEMP}/gti-system-library-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/gti-system-stage"
          cmake --build "${RUNNER_TEMP}/gti-system-library-smoke" --config Release --parallel "${GTI_JOBS}"
          ctest --test-dir "${RUNNER_TEMP}/gti-system-library-smoke" -C Release \
            --parallel "${GTI_TEST_JOBS}" --output-on-failure
          python3 tests/process_resource_policy_test.py "${RUNNER_TEMP}/gti-system-stage/bin/gti" --installed
      - name: Save compiler object cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}

  package:
    name: Release package (${{ matrix.platform }})
    needs: [plan, automation-tests, formatting, release-version, tree-sitter]
    if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # linux-arm64 is not packaged: runtime/src/atomic_lane.h has no
        # reviewed linux-aarch64 compiler profile, so configure_ci_toolchain.sh
        # cannot admit a compiler there. See build-and-driver.md.
        include:
          - {os: ubuntu-24.04, platform: linux-x64, host: Linux-X64}
          - {os: macos-26, platform: darwin-arm64, host: macOS-ARM64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the exact nightly source and runner
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_EXPECTED_HOST: ${{ matrix.host }}
        run: |
          if [[ "${RUNNER_OS}-${RUNNER_ARCH}" != "${GTI_EXPECTED_HOST}" ]]; then
            echo "Runner ${RUNNER_OS}-${RUNNER_ARCH} is not ${GTI_EXPECTED_HOST}" >&2
            exit 1
          fi
          python3 scripts/resolve_release_source.py source --sha "${GTI_NIGHTLY_SHA}" \
            --event nightly --output "${RUNNER_TEMP}/gti-source"
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # The bundled LLVM/Clang build compiles its large units beside GTI's.
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler and LLVM/Clang object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-
      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Check native driver compilation before LLVM/Clang
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o
      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"
      - name: Stage toolchain
        run: |
          stage="$(mktemp -d "${RUNNER_TEMP}/gti-stage.XXXXXXXX")"
          printf 'GTI_STAGE_DIRECTORY=%s\n' "${stage}" >> "${GITHUB_ENV}"
          cmake --install build --config Release --prefix "${stage}" --component gti_toolchain
      - name: Test installed toolchain
        run: |
          export PATH="${GTI_STAGE_DIRECTORY}/bin:${PATH}"
          source="${GITHUB_WORKSPACE}"
          cd "${RUNNER_TEMP}"
          python3 "${source}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${source}/tests/cli_smoke_test.py" gti
          python3 "${source}/tests/project_cli_smoke_test.py" gti
          python3 "${source}/tests/process_resource_policy_test.py" gti --installed
          python3 "${source}/tests/managed_thread_runtime_test.py" gti
          python3 "${source}/tests/atomic_runtime_test.py" gti \
            "${source}/tests/fixtures/atomic_scalar.gti" \
            "${source}/tests/fixtures/atomic_concurrent.gti" \
            "${source}/tests/fixtures/atomic_orders.gti" \
            "${source}/tests/fixtures/atomic_fetch.gti" \
            "${source}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake -S "${source}/tests/installed_library_smoke" \
            -B "${RUNNER_TEMP}/gti-installed-library-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GTI_STAGE_DIRECTORY}"
          cmake --build "${RUNNER_TEMP}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest --test-dir "${RUNNER_TEMP}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure
      - name: Create nightly archive from the validated stage
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_PLATFORM: ${{ matrix.platform }}
        run: >-
          cmake
          -DGTI_SOURCE_DIR="${GITHUB_WORKSPACE}"
          -DGTI_STAGE_DIR="${GTI_STAGE_DIRECTORY}"
          -DGTI_OUTPUT_DIR="${GITHUB_WORKSPACE}/dist/nightly"
          -DGTI_PLATFORM="${GTI_PLATFORM}"
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID="${GTI_NIGHTLY_SHA}"
          -P cmake/PackageRelease.cmake
      - name: Record package identity and checksums
        env:
          GTI_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release_artifacts.py record --directory dist/nightly --platform "${GTI_PLATFORM}"
      - name: Upload nightly archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-${{ matrix.platform }}-${{ github.run_attempt }}
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 30
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi
      # The release suite shards restore this exact key and rebuild the same
      # configuration from cached objects.
      - name: Save compiler and LLVM/Clang cache, including partial builds
        if: always() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  integration:
    name: Integration (${{ matrix.platform }} ${{ matrix.index }}/${{ matrix.shards }})
    needs: [plan, package, automation-tests, formatting, release-version, tree-sitter]
    if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 0}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 1}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 2}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 3}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 4}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 5}
          - {os: macos-26, platform: darwin, shards: 5, index: 0}
          - {os: macos-26, platform: darwin, shards: 5, index: 1}
          - {os: macos-26, platform: darwin, shards: 5, index: 2}
          - {os: macos-26, platform: darwin, shards: 5, index: 3}
          - {os: macos-26, platform: darwin, shards: 5, index: 4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the packaging job's object cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
      - name: Configure release build
        # Hosted runners are slower than the hosts test bounds were measured on;
        # scale them as the merge queue does.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Run this shard of the complete release suite
        env:
          GTI_SHARDS: ${{ matrix.shards }}
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: >-
          python3 scripts/validation_checks.py shard --build build
          --shards "${GTI_SHARDS}" --index "${GTI_SHARD_INDEX}"
          --jobs "${GTI_TEST_JOBS}"
          --report "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.json"
          --log "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log"
      - name: Show the shard log on failure
        if: failure()
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: tail -n 400 "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log" || true
      - name: Verify deterministic API generation
        if: matrix.platform == 'linux' && matrix.index == 0
        run: |
          cmake --build build --parallel "${GTI_JOBS}" --target gti_docgen
          build/gti_docgen --stdlib stdlib --output build/documentation-index.json
          build/gti_docgen --stdlib stdlib --output build/documentation-index-repeat.json
          cmp build/documentation-index.json build/documentation-index-repeat.json
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.platform }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/shard/*.json
            ${{ runner.temp }}/shard/*.xml
          retention-days: 30
          if-no-files-found: ignore

  sanitizers:
    name: Compiler sanitizers (${{ matrix.kind }} ${{ matrix.index }}/2)
    if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.mode == 'full'
    needs: [plan, automation-tests, formatting, release-version, tree-sitter]
    # The compiler aggregate exceeded three hours serially. Split its six
    # suites across two runners, separately from the two library partitions.
    # Every compiler partition verifies the complete manifest census first.
    strategy:
      fail-fast: false
      matrix:
        kind: [compiler, libraries]
        index: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # The curated subset; the build compiles only the targets it runs.
      GTI_SANITIZER_TESTS: 'compiler_library_boundary|driver_library_boundary|driver_pipeline|project_model|compiler_pipeline|optimizer_foundation|raw_pointer_pipeline|mir_program_initialization|mir_hosted_startup|mir_backend_first_family$|mir_backend_scalar_cfg$|mir_backend_scalar_direct_call$|mir_backend_class_default_cleanup$|mir_backend_owned_lifecycle$|mir_backend_scalar_failure_callgraph$|cpp_mir_body_emitter_(preflight|text|lifecycle|census|corpus_protocol)$|cpp_mir_program_plan|cpp_mir_representation_snapshot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # ASan/UBSan instrumentation needs more memory per compile and test:
          # with 4 GiB per test, compiler_pipeline and the body-emitter
          # lifecycle suite together exhausted the 16 GiB runner (SIGKILL).
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 8192
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/sanitizers
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-
      - name: Check compiler sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGTI_BUILD_LSP=OFF
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=6
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build the targets the sanitizer subset runs
        # Instrumenting the whole tree took longer than the integration shards
        # while only these tests run; CTestTestfile.cmake names their targets.
        run: |
          pattern="${GTI_SANITIZER_TESTS}"
          if [[ "${{ matrix.kind }}" == "compiler" ]]; then
            pattern='^compiler_pipeline$'
          fi
          targets="$(python3 scripts/validation_checks.py test-targets --build build-sanitized --regex "${pattern}")"
          read -r -a target_list <<< "${targets}"
          cmake --build build-sanitized --parallel "${GTI_JOBS}" --target "${target_list[@]}"
      - name: Test compiler and driver libraries
        # Instrumented suites run several times slower than plain ones, so
        # the configure step scales every test's timeout six times (the
        # 600-second default becomes an hour). The whole generated-C++
        # corpus and the failure-metadata matrix exceed even that under ASan
        # and remain the native integration gates.
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [[ "${{ matrix.kind }}" == "compiler" ]]; then
            GTI_COMPILER_TEST_SHARD_INDEX="${{ matrix.index }}" GTI_COMPILER_TEST_SHARD_COUNT=2 \
              ctest --test-dir build-sanitized --verbose --output-on-failure --no-tests=error \
              --output-junit "${RUNNER_TEMP}/sanitizers-${{ matrix.kind }}-${{ matrix.index }}.xml" \
              -R '^compiler_pipeline$'
          else
            ctest --test-dir build-sanitized --verbose --output-on-failure --no-tests=error \
              --output-junit "${RUNNER_TEMP}/sanitizers-${{ matrix.kind }}-${{ matrix.index }}.xml" \
              --parallel "${GTI_TEST_JOBS}" -R "${GTI_SANITIZER_TESTS}" \
              -E '^(compiler_pipeline|cpp_mir_body_emitter_lifecycle)$' -I "${{ matrix.index }},,2"
          fi
      - name: Test named lifecycle cases
        # The aggregate took 83 minutes against its 90-minute bound. Split
        # every existing case across the library jobs, retaining that bound.
        if: ${{ !cancelled() && matrix.kind == 'libraries' }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python3 scripts/named_test_shards.py run
          --executable build-sanitized/gti_cpp_mir_body_emitter_lifecycle_tests
          --index "${{ matrix.index }}" --count 2 --timeout 5400
          --source "${{ github.sha }}"
          --report "${RUNNER_TEMP}/lifecycle-${{ matrix.index }}.json"
      - name: Preserve sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers-${{ matrix.kind }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/sanitizers-${{ matrix.kind }}-${{ matrix.index }}.xml
            ${{ runner.temp }}/lifecycle-${{ matrix.index }}.json
            build-sanitized/Testing/Temporary/LastTest.log
            build-sanitized/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 7
      - name: Save compiler object cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-sanitizers-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}

  gate:
    # The single required status check: its name is the ruleset's context.
    name: CI gate
    if: always()
    needs: [plan, automation-tests, formatting, release-version, tree-sitter, fast, package, integration, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect shard evidence
        if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - name: Collect lifecycle sanitizer evidence
        if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sanitizers-libraries-*
          path: ${{ runner.temp }}/lifecycle-shards
      - name: Require every lifecycle sanitizer case
        if: (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.mode == 'full'
        run: >-
          python3 scripts/named_test_shards.py verify
          --reports "${RUNNER_TEMP}/lifecycle-shards"
          --source "${{ github.sha }}" --count 2
      - name: Decide integration acceptance
        env:
          GTI_VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
          GTI_VALIDATION_RESULTS: ${{ toJSON(needs) }}
          GTI_EVENT_NAME: ${{ github.event_name }}
        run: |
          event="${GTI_EVENT_NAME}"
          if [[ "${event}" == "workflow_dispatch" ]]; then
            event="merge_group"
          fi
          python3 scripts/validation_checks.py ci-gate --mode "${GTI_VALIDATION_MODE}" \
            --results "${GTI_VALIDATION_RESULTS}" --event "${event}" \
            --shard-reports "${RUNNER_TEMP}/shards"

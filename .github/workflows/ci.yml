name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-version:
    name: Release version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped tooling changes
        env:
          GTI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_release_version.py "${base}" "${GITHUB_SHA}"

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti

      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          git diff --exit-code -- src

  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_BUNDLE_JSON_C=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

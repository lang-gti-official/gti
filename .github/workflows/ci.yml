name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install pinned clang-format
        run: |
          python3 -m venv .format-tools
          .format-tools/bin/pip install "clang-format==$(cat .clang-format-version)"

      - name: Verify first-party C and C++ formatting
        env:
          GTI_CLANG_FORMAT: .format-tools/bin/clang-format
        run: python3 scripts/clang_format.py --check

  release-version:
    name: Release version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped tooling changes
        env:
          GTI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_release_version.py "${base}" "${GITHUB_SHA}"

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti

      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          npm run test:shipped
          git diff --exit-code -- src

  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install LLVM 18
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends llvm-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Install LLVM 20
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_BUNDLE_JSON_C=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage system-LLVM toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-system-stage"
          --component gti_toolchain

      - name: Test installed libraries with system LLVM
        run: |
          cmake \
            -S tests/installed_library_smoke \
            -B "${{ runner.temp }}/gti-system-library-smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-system-stage"
          cmake --build \
            "${{ runner.temp }}/gti-system-library-smoke" \
            --config Release
          ctest \
            --test-dir "${{ runner.temp }}/gti-system-library-smoke" \
            -C Release --output-on-failure

  compiler-sanitizers:
    name: Compiler sanitizers
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends llvm-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DGTI_BUILD_LSP=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitized --parallel 4

      - name: Test compiler and driver libraries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized --output-on-failure
          -R 'compiler_library_boundary|driver_library_boundary|driver_pipeline|project_model|compiler_pipeline|optimizer_foundation|raw_pointer_pipeline'

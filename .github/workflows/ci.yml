name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti

      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          git diff --exit-code -- src

  build-and-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_BUNDLE_JSON_C=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

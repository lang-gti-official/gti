name: CI

# One required check, "CI gate". A pull request proves lint and fast checks
# before it may enter the merge queue; the queue proves the same build and
# fast checks on the exact candidate that becomes main. The complete suite
# (production packaging, every integration shard) runs after integration on
# each main head in full-validation.yml, and the sanitizers daily on the
# nightly commit in sanitizers.yml, the way
# rustc and LLVM gate merges on a bounded build-and-test and prove the full
# matrix post-merge. Contributors run focused checks locally and never repeat
# the complete suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A new push supersedes a PR's run; queue candidates are never cancelled by
  # one another.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify candidate without weakening its merge gate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GTI_EVENT_PATH: ${{ github.event_path }}
          GTI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [[ -z "${GTI_EVENT_PATH}" || ! -f "${GTI_EVENT_PATH}" ]]; then
            echo "The event payload must name an existing file." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
            echo 'mode=full' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse origin/main)"
          fi
          python3 scripts/source_stdlib_ci.py plan \
            --event "${GTI_EVENT_PATH}" --base "${base}" \
            --repository "${GITHUB_REPOSITORY}" --output "${RUNNER_TEMP}/source-plan.json" >> "${GITHUB_OUTPUT}"
      - name: Report the declared T0/T1 tests
        # Advisory: a malformed Validation block warns; it never fails the plan.
        if: github.event_name == 'pull_request' && steps.plan.outputs.mode == 'full'
        env:
          GTI_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/validation_checks.py declared --event "${GTI_EVENT_PATH}"

  automation-tests:
    name: Workflow regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install workflow test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make
      - name: Verify workflow, batch, preservation and resource rules
        run: |
          git config --global user.name "GTI CI"
          git config --global user.email "ci@example.invalid"
          python3 tests/agent_workflow_test.py
          python3 tests/rollup_test.py
          python3 tests/build_window_test.py
          python3 tests/bounded_log_test.py
          python3 tests/release_version_test.py scripts/check_release_version.py
          python3 tests/stdlib_surface_review_test.py scripts/check_stdlib_surface_review.py
          python3 tests/cut_release_test.py
          python3 tests/release_train_test.py
          python3 tests/ci_release_test.py .
          python3 tests/ci_resources_test.py scripts/configure_ci_resources.sh
          python3 tests/repository_hosting_test.py .
          python3 tests/ownership_map_test.py
          python3 tests/plan_checks_test.py
          python3 tests/named_test_shards_test.py
          python3 tests/source_stdlib_ci_test.py
          python3 tests/lsp_release_test.py

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned clang-format
        run: |
          python3 -m venv .format-tools
          .format-tools/bin/pip install "clang-format==$(cat .clang-format-version)"
      - name: Verify first-party C and C++ formatting
        env:
          GTI_CLANG_FORMAT: .format-tools/bin/clang-format
        run: python3 scripts/clang_format.py --check

  release-version:
    name: Release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Find where the candidate forked
        id: range
        env:
          GTI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GTI_HEAD_SHA: ${{ github.sha }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          # Judge the candidate from where it forked, not from a main that has
          # advanced past it.
          echo "base=$(git merge-base "${base}" "${GTI_HEAD_SHA}")" >> "${GITHUB_OUTPUT}"
      - name: Require a version decision for shipped tooling changes
        env:
          GTI_FORK_SHA: ${{ steps.range.outputs.base }}
          GTI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_release_version.py "${GTI_FORK_SHA}" "${GTI_HEAD_SHA}"
      - name: Report the surface review for changed stdlib sources
        # Advisory: a missing manifest review warns; it never blocks.
        env:
          GTI_FORK_SHA: ${{ steps.range.outputs.base }}
          GTI_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_stdlib_surface_review.py "${GTI_FORK_SHA}" "${GTI_HEAD_SHA}" --advisory

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti
      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          npm run test:shipped
          npm run test:source-text
          git diff --exit-code -- src

  fast:
    name: Fast checks (${{ matrix.platform }})
    if: needs.plan.outputs.mode == 'full'
    needs: [plan, automation-tests, formatting, release-version, tree-sitter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: macos-26, platform: darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 2048
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/native
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Build
        # Keep going after a failure so one run reports every compile error.
        run: cmake --build build --parallel "${GTI_JOBS}" -- -k 0
      - name: Run fast feedback
        env:
          GTI_TEST_BACKENDS: llvm
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          --parallel "${GTI_TEST_JOBS}" -L feedback-fast
      - name: Run the compiler pipeline
        # Frontend/MIR unit suites carry no platform dependence: Linux proves
        # them once per candidate, and the macOS fast job stays with the
        # feedback set and the declared tests.
        if: matrix.platform == 'linux'
        env:
          GTI_TEST_BACKENDS: llvm
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error -R '^compiler_pipeline$'
      - name: Re-run the tests this pull request declares
        if: github.event_name == 'pull_request'
        # The body is untrusted: the script validates every name and passes
        # them to CTest as an escaped, anchored pattern, never through a shell.
        # Block-format and unregistered-name findings are warnings; a declared
        # test that runs and fails still fails the job.
        env:
          GTI_EVENT_PATH: ${{ github.event_path }}
        run: >-
          python3 scripts/validation_checks.py declared --event "${GTI_EVENT_PATH}"
          --build build --jobs "${GTI_TEST_JOBS}"
      - name: Test the installed toolchain against system LLVM
        if: matrix.platform == 'linux'
        run: |
          cmake --install build --config Release --prefix "${RUNNER_TEMP}/gti-system-stage" --component gti_toolchain
          cmake -S tests/installed_library_smoke -B "${RUNNER_TEMP}/gti-system-library-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/gti-system-stage"
          cmake --build "${RUNNER_TEMP}/gti-system-library-smoke" --config Release --parallel "${GTI_JOBS}"
          ctest --test-dir "${RUNNER_TEMP}/gti-system-library-smoke" -C Release \
            --parallel "${GTI_TEST_JOBS}" --output-on-failure
          python3 tests/process_resource_policy_test.py "${RUNNER_TEMP}/gti-system-stage/bin/gti" --installed
      # cache.yml owns the native cache under its content key; PR and queue
      # runs only restore it. Per-SHA saves from queue refs were unreachable by
      # later runs and evicted the reachable entries from the 10 GB cache.
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

  source-stdlib:
    name: Source stdlib (${{ matrix.platform }})
    if: needs.plan.outputs.mode == 'source-stdlib'
    needs: [plan, automation-tests, formatting, release-version, tree-sitter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: macos-26, platform: darwin-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain admitted compiler and source identities
        env:
          GTI_REUSE_PLAN: ${{ needs.plan.outputs.reuse }}
        run: python3 -c 'import os,pathlib; pathlib.Path("source-plan.json").write_text(os.environ["GTI_REUSE_PLAN"])'
      - name: Configure resources
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 2048
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install reviewed native test prerequisites
        run: bash scripts/configure_ci_toolchain.sh
      - name: Download exact full-CI compiler artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(needs.plan.outputs.reuse).compiler_origin.run_id }}
          name: gti-nightly-${{ matrix.platform }}-${{ fromJSON(needs.plan.outputs.reuse).compiler_origin.attempt }}
          path: compiler-artifact
      - name: Verify native identity and replace only library source
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/source_stdlib_ci.py prepare --plan source-plan.json
          --platform "${{ matrix.platform }}" --directory compiler-artifact --stage stage
      - name: Build test consumers and execute affected library checks
        run: >-
          python3 scripts/source_stdlib_ci.py test --plan source-plan.json
          --stage stage --build build --jobs "${GTI_JOBS}" --test-jobs "${GTI_TEST_JOBS}"
      - name: Check installed consumers of the updated library
        run: |
          python3 tests/cli_smoke_test.py "${PWD}/stage/bin/gti"
          python3 tests/lsp_smoke_test.py "${PWD}/stage/bin/gti_lsp"
          python3 tests/project_cli_smoke_test.py "${PWD}/stage/bin/gti"
          python3 tests/process_resource_policy_test.py "${PWD}/stage/bin/gti" --installed
      - name: Verify tested source and native payload before packaging
        run: >-
          python3 scripts/source_stdlib_ci.py seal --plan source-plan.json
          --stage stage --platform "${{ matrix.platform }}"
      - name: Package validated source with unchanged native payload
        if: github.event_name == 'merge_group'
        run: |
          cmake -DGTI_SOURCE_DIR="$PWD" -DGTI_STAGE_DIR="$PWD/stage" -DGTI_OUTPUT_DIR="$PWD/release" \
            -DGTI_PLATFORM="${{ matrix.platform }}" -DGTI_CHANNEL=nightly -DGTI_BUILD_ID="${GITHUB_SHA}" \
            -P cmake/PackageRelease.cmake
          python3 scripts/release_artifacts.py record --directory release --platform "${{ matrix.platform }}" \
            --compiler-origin stage/share/gti/COMPILER_ORIGIN.json
      - name: Retain source-library integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-stdlib-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            source-plan.json
            source-native-${{ matrix.platform }}.json
            build/source-stdlib.xml
            build/source-stdlib-evidence.json
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 30
          if-no-files-found: error
      - name: Retain production package for nightly
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-${{ matrix.platform }}-${{ github.run_attempt }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

  lsp:
    name: LSP (${{ matrix.platform }})
    if: needs.plan.outputs.mode == 'lsp'
    needs: [plan, automation-tests, formatting, release-version, tree-sitter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64}
          - {os: macos-26, platform: darwin-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain admitted compiler and source identities
        env:
          GTI_REUSE_PLAN: ${{ needs.plan.outputs.reuse }}
        run: python3 -c 'import os,pathlib; pathlib.Path("lsp-plan.json").write_text(os.environ["GTI_REUSE_PLAN"])'
      - name: Configure resources
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 2048
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install reviewed native test prerequisites
        run: bash scripts/configure_ci_toolchain.sh
      - name: Install pinned Neovim for mandatory editor checks
        run: python3 scripts/install_ci_neovim.py
      - name: Download exact full-CI compiler artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ fromJSON(needs.plan.outputs.reuse).compiler_origin.run_id }}
          name: gti-nightly-${{ matrix.platform }}-${{ fromJSON(needs.plan.outputs.reuse).compiler_origin.attempt }}
          path: compiler-artifact
      - name: Verify exact compatible compiler SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/lsp_ci.py prepare --plan lsp-plan.json
          --platform "${{ matrix.platform }}" --directory compiler-artifact --stage stage
      - name: Rebuild the adapter and validate LSP, editor and compiler consumers
        run: >-
          python3 scripts/lsp_ci.py test --plan lsp-plan.json
          --stage stage --build build --jobs "${GTI_JOBS}" --test-jobs "${GTI_TEST_JOBS}"
      - name: Check installed consumers of the updated library
        run: |
          python3 tests/cli_smoke_test.py "${PWD}/stage/bin/gti"
          python3 tests/lsp_smoke_test.py "${PWD}/stage/bin/gti_lsp"
          python3 tests/project_cli_smoke_test.py "${PWD}/stage/bin/gti"
          python3 tests/process_resource_policy_test.py "${PWD}/stage/bin/gti" --installed
      - name: Verify tested source and native payload before packaging
        run: >-
          python3 scripts/lsp_ci.py seal --plan lsp-plan.json --build build
          --stage stage --platform "${{ matrix.platform }}"
      - name: Package validated LSP with unchanged compiler resources
        if: github.event_name == 'merge_group'
        run: |
          cmake -DGTI_SOURCE_DIR="$PWD" -DGTI_STAGE_DIR="$PWD/stage" -DGTI_OUTPUT_DIR="$PWD/release" \
            -DGTI_PLATFORM="${{ matrix.platform }}" -DGTI_CHANNEL=nightly -DGTI_BUILD_ID="${GITHUB_SHA}" \
            -P cmake/PackageRelease.cmake
          python3 scripts/release_artifacts.py record --directory release --platform "${{ matrix.platform }}" \
            --compiler-origin stage/share/gti/COMPILER_ORIGIN.json
      - name: Retain LSP integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsp-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            lsp-plan.json
            lsp-native-${{ matrix.platform }}.json
            build/lsp.xml
            build/lsp-evidence.json
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          retention-days: 30
          if-no-files-found: error
      - name: Retain production package for nightly
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-${{ matrix.platform }}-${{ github.run_attempt }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

  gate:
    # The single required status check: its name is the ruleset's context.
    name: CI gate
    if: always()
    needs: [plan, automation-tests, formatting, release-version, tree-sitter, fast, source-stdlib, lsp]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide integration acceptance
        env:
          GTI_VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
          GTI_VALIDATION_RESULTS: ${{ toJSON(needs) }}
          GTI_EVENT_NAME: ${{ github.event_name }}
        run: |
          event="${GTI_EVENT_NAME}"
          if [[ "${event}" == "workflow_dispatch" ]]; then
            event="merge_group"
          fi
          python3 scripts/validation_checks.py ci-gate --mode "${GTI_VALIDATION_MODE}" \
            --results "${GTI_VALIDATION_RESULTS}" --event "${event}"

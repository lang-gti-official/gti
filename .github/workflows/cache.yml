name: Compiler cache

# GitHub shares an Actions cache across branches only when the default branch
# saved it. CI runs on pull requests and merge-queue refs, never on main, so
# without this workflow every PR and every queue entry compiled the whole tree
# cold. After each merge to main, this warms compiler/LSP objects with each
# CI compile configuration (no test executables), saving ccache under main.
# Every later pull request and merge-group run restores it. The configure lines must match ci.yml
# exactly (tests/repository_hosting_test.py checks), or the objects miss.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Warm-ups queue rather than cancel: the keys are content-derived, so a
# superseded run still produces a cache the next run restores, and the
# instrumented warm (over two hours cold) must be allowed to finish once.
# The release (bundled LLVM/Clang) profile is warmed by llvm-prebuilt.yml.
concurrency:
  group: gti-compiler-cache
  cancel-in-progress: false

jobs:
  warm:
    name: Warm the ${{ matrix.profile }} cache (${{ matrix.platform }})
    if: github.repository == 'lang-gti-official/gti'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, profile: native, memory: 2048, build: build}
          - {os: macos-26, platform: darwin, profile: native, memory: 2048, build: build}
          - {os: ubuntu-24.04, platform: linux, profile: sanitizers, memory: 3072, build: build-sanitized}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: ${{ matrix.memory }}
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/${{ matrix.profile }}
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the previous main cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure
        if: matrix.profile == 'native'
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Configure the sanitizer build
        if: matrix.profile == 'sanitizers'
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGTI_BUILD_LSP=OFF
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=6
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link
      - name: Trim restored cache before building
        run: ccache --cleanup
      - name: Build compiler cache inputs
        id: build
        shell: bash
        run: |
          # Linking every instrumented test binary exhausted the runner disk.
          # CI owns test targets; warm only the compiler's shared dependencies.
          targets=(gti)
          if [[ "${{ matrix.profile }}" == native ]]; then
            targets+=(gti_lsp)
          fi
          df -h .
          cmake --build "${{ matrix.build }}" --parallel "${GTI_JOBS}" --target "${targets[@]}"
      - name: Release warmup scratch space before cache upload
        if: always()
        shell: bash
        run: |
          # These fixed matrix paths are disposable scratch, never cache input.
          du -sh "${{ matrix.build }}" "${CCACHE_DIR:-${RUNNER_TEMP}/gti-ccache/${{ matrix.profile }}}" 2>/dev/null || true
          rm -rf -- "${{ matrix.build }}"
          if command -v ccache >/dev/null 2>&1; then
            ccache --cleanup
          fi
          df -h .
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      # Only a build that ran to completion saves. Saving on `always()` once
      # stored the few objects a cancelled run had compiled under the content
      # key, after which every later run hit the key and skipped the build.
      - name: Save the cache under main
        if: steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-${{ matrix.profile }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}

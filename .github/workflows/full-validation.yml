name: Full validation

# The complete suite, run after integration on every main head (and on
# dispatch), never as the merge gate. This is the Rust/LLVM model: the merge
# queue proves build and fast checks on the exact candidate; this workflow
# proves production packaging, every bundled-release integration shard on both
# platforms and the compiler sanitizers on the merged result, and produces the
# packages the nightly, beta and release-train channels publish. A failure
# opens (or updates) a `main-broken` issue naming the commit range; it never
# blocks the queue, and a channel never selects a main commit this workflow
# has not passed. See docs/architecture/agent-workflow.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Runs queue rather than cancel. The merge queue batches merges, so main can
  # advance several times inside one full-validation run; cancelling the older
  # run on every push left no head ever proven (the first run on the split
  # gate was cancelled at 42 minutes). A superseded head's verdict is still
  # evidence for the channels, and the newest head follows it.
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a main head
        id: plan
        run: |
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          echo 'mode=full' >> "${GITHUB_OUTPUT}"
  package:
    name: Release package (${{ matrix.platform }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # linux-arm64 is not packaged: runtime/src/atomic_lane.h has no
        # reviewed linux-aarch64 compiler profile, so configure_ci_toolchain.sh
        # cannot admit a compiler there. See build-and-driver.md.
        include:
          - {os: ubuntu-24.04, platform: linux-x64, host: Linux-X64}
          - {os: macos-26, platform: darwin-arm64, host: macOS-ARM64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the exact nightly source and runner
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_EXPECTED_HOST: ${{ matrix.host }}
        run: |
          if [[ "${RUNNER_OS}-${RUNNER_ARCH}" != "${GTI_EXPECTED_HOST}" ]]; then
            echo "Runner ${RUNNER_OS}-${RUNNER_ARCH} is not ${GTI_EXPECTED_HOST}" >&2
            exit 1
          fi
          python3 scripts/resolve_release_source.py source --sha "${GTI_NIGHTLY_SHA}" \
            --event nightly --output "${RUNNER_TEMP}/gti-source"
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # The bundled LLVM/Clang build compiles its large units beside GTI's.
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler and LLVM/Clang object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Check native driver compilation before LLVM/Clang
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o
      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"
      - name: Stage toolchain
        run: |
          stage="$(mktemp -d "${RUNNER_TEMP}/gti-stage.XXXXXXXX")"
          printf 'GTI_STAGE_DIRECTORY=%s\n' "${stage}" >> "${GITHUB_ENV}"
          cmake --install build --config Release --prefix "${stage}" --component gti_toolchain
      - name: Test installed toolchain
        run: |
          export PATH="${GTI_STAGE_DIRECTORY}/bin:${PATH}"
          source="${GITHUB_WORKSPACE}"
          cd "${RUNNER_TEMP}"
          python3 "${source}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${source}/tests/cli_smoke_test.py" gti
          python3 "${source}/tests/project_cli_smoke_test.py" gti
          python3 "${source}/tests/process_resource_policy_test.py" gti --installed
          python3 "${source}/tests/managed_thread_runtime_test.py" gti
          python3 "${source}/tests/atomic_runtime_test.py" gti \
            "${source}/tests/fixtures/atomic_scalar.gti" \
            "${source}/tests/fixtures/atomic_concurrent.gti" \
            "${source}/tests/fixtures/atomic_orders.gti" \
            "${source}/tests/fixtures/atomic_fetch.gti" \
            "${source}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake -S "${source}/tests/installed_library_smoke" \
            -B "${RUNNER_TEMP}/gti-installed-library-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GTI_STAGE_DIRECTORY}"
          cmake --build "${RUNNER_TEMP}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest --test-dir "${RUNNER_TEMP}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure
      - name: Create nightly archive from the validated stage
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_PLATFORM: ${{ matrix.platform }}
        run: >-
          cmake
          -DGTI_SOURCE_DIR="${GITHUB_WORKSPACE}"
          -DGTI_STAGE_DIR="${GTI_STAGE_DIRECTORY}"
          -DGTI_OUTPUT_DIR="${GITHUB_WORKSPACE}/dist/nightly"
          -DGTI_PLATFORM="${GTI_PLATFORM}"
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID="${GTI_NIGHTLY_SHA}"
          -P cmake/PackageRelease.cmake
      - name: Record package identity and checksums
        env:
          GTI_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release_artifacts.py record --directory dist/nightly --platform "${GTI_PLATFORM}"
      - name: Upload nightly archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-${{ matrix.platform }}-${{ github.run_attempt }}
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 30
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi
      # llvm-prebuilt.yml owns the release cache under its toolchain-content
      # key; a validation run only restores it. Saving a per-run key here
      # evicted the reachable entries from the 10 GB cache.

  integration:
    name: Integration (${{ matrix.platform }} ${{ matrix.index }}/${{ matrix.shards }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 0}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 1}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 2}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 3}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 4}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 5}
          # macOS proves only what differs on the platform (the `darwin` test
          # set: AArch64 LLVM backend, Apple-only tests, threads/TLS/atomics,
          # debug info, install/bundle/link, ABI/layout). Linux proves the
          # rest once. See AGENTS.md "Validation".
          - {os: macos-26, platform: darwin, shards: 2, index: 0}
          - {os: macos-26, platform: darwin, shards: 2, index: 1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the prebuilt LLVM/Clang and release object cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure release build
        # Hosted runners are slower than the hosts test bounds were measured on;
        # scale them as the merge queue does.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Run this shard of the complete release suite
        env:
          GTI_SHARDS: ${{ matrix.shards }}
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
          GTI_SHARD_TEST_SET: ${{ matrix.platform == 'darwin' && 'darwin' || 'full' }}
        run: >-
          GTI_TEST_BACKENDS=llvm
          python3 scripts/validation_checks.py shard --build build
          --test-set "${GTI_SHARD_TEST_SET}"
          --shards "${GTI_SHARDS}" --index "${GTI_SHARD_INDEX}"
          --jobs "${GTI_TEST_JOBS}"
          --report "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.json"
          --log "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log"
      - name: Show the shard log on failure
        if: failure()
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: tail -n 400 "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log" || true
      - name: Verify deterministic API generation
        if: matrix.platform == 'linux' && matrix.index == 0
        run: |
          cmake --build build --parallel "${GTI_JOBS}" --target gti_docgen
          build/gti_docgen --stdlib stdlib --output build/documentation-index.json
          build/gti_docgen --stdlib stdlib --output build/documentation-index-repeat.json
          cmp build/documentation-index.json build/documentation-index-repeat.json
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.platform }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/shard/*.json
            ${{ runner.temp }}/shard/*.xml
          retention-days: 30
          if-no-files-found: ignore

  sanitizers:
    name: Compiler sanitizers (${{ matrix.kind }} ${{ matrix.index }}/${{ matrix.count }})
    # Every sanitized configure serializes linking (CMAKE_JOB_POOL_LINK):
    # linking several ASan/UBSan executables at once exhausted the 16 GiB
    # runner and the VM was shut down mid-build three times on 2026-11-03
    # ("runner has received a shutdown signal"). Compiles stay parallel.
    if: needs.plan.outputs.mode == 'full'
    needs: [plan]
    # The compiler aggregate exceeded three hours serially. Split its six
    # suites across two runners. Every compiler partition verifies the
    # complete manifest census first. Without the C++ emitter suites (now in
    # cpp-backend.yml) the library partition fits one runner, which saves a
    # cold instrumented build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: compiler, index: 1, count: 2}
          - {kind: compiler, index: 2, count: 2}
          - {kind: libraries, index: 1, count: 1}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # The curated subset; the build compiles only the targets it runs.
      GTI_SANITIZER_TESTS: 'compiler_library_boundary|driver_library_boundary|driver_pipeline|project_model|compiler_pipeline$|optimizer_foundation|raw_pointer_pipeline|mir_program_initialization|mir_hosted_startup|mir_backend_first_family$|mir_backend_scalar_cfg$|mir_backend_scalar_direct_call$|mir_backend_class_default_cleanup$|mir_backend_owned_lifecycle$|mir_backend_scalar_failure_callgraph$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # ASan/UBSan instrumentation needs more memory per compile and test:
          # with 4 GiB per test, compiler_pipeline and the body-emitter
          # lifecycle suite together exhausted the 16 GiB runner (SIGKILL).
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 8192
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/sanitizers
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-sanitizers-${{ runner.os }}-${{ runner.arch }}-
      - name: Check compiler sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGTI_BUILD_LSP=OFF
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=6
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link
      - name: Build the targets the sanitizer subset runs
        # Instrumenting the whole tree took longer than the integration shards
        # while only these tests run; CTestTestfile.cmake names their targets.
        run: |
          pattern="${GTI_SANITIZER_TESTS}"
          if [[ "${{ matrix.kind }}" == "compiler" ]]; then
            pattern='^compiler_pipeline$'
          fi
          targets="$(python3 scripts/validation_checks.py test-targets --build build-sanitized --regex "${pattern}")"
          read -r -a target_list <<< "${targets}"
          cmake --build build-sanitized --parallel "${GTI_JOBS}" --target "${target_list[@]}"
      - name: Test compiler and driver libraries
        # Instrumented suites run several times slower than plain ones, so
        # the configure step scales every test's timeout six times (the
        # 600-second default becomes an hour). The whole generated-C++
        # corpus and the failure-metadata matrix exceed even that under ASan
        # and remain the native integration gates.
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [[ "${{ matrix.kind }}" == "compiler" ]]; then
            GTI_COMPILER_TEST_SHARD_INDEX="${{ matrix.index }}" GTI_COMPILER_TEST_SHARD_COUNT="${{ matrix.count }}" \
              ctest --test-dir build-sanitized --verbose --output-on-failure --no-tests=error \
              --output-junit "${RUNNER_TEMP}/sanitizers-${{ matrix.kind }}-${{ matrix.index }}.xml" \
              -R '^compiler_pipeline$'
          else
            ctest --test-dir build-sanitized --verbose --output-on-failure --no-tests=error \
              --output-junit "${RUNNER_TEMP}/sanitizers-${{ matrix.kind }}-${{ matrix.index }}.xml" \
              --parallel "${GTI_TEST_JOBS}" -R "${GTI_SANITIZER_TESTS}" \
              -E '^compiler_pipeline$' -I "${{ matrix.index }},,${{ matrix.count }}"
          fi
      - name: Preserve sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers-${{ matrix.kind }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/sanitizers-${{ matrix.kind }}-${{ matrix.index }}.xml
            build-sanitized/Testing/Temporary/LastTest.log
            build-sanitized/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 30
      # cache.yml owns the sanitizer cache under its content key; a validation
      # run only restores it.
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true


  llvm-sanitizers:
    # The shipping backend under ASan/UBSan: the compiler's LLVM unit tests
    # and the LLVM execution harnesses through an instrumented `gti`. The
    # system LLVM libraries stay uninstrumented; bugs inside LLVM are out of
    # scope. This replaced instrumenting the deprecated C++ emitter.
    name: LLVM backend sanitizers
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GTI_TEST_BACKENDS: llvm
      GTI_LLVM_SANITIZER_TESTS: '^llvm_'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 6144
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/sanitizers
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-sanitizers-${{ runner.os }}-${{ runner.arch }}-
      - name: Check compiler sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGTI_BUILD_LSP=OFF
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=6
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_JOB_POOLS=link=1 -DCMAKE_JOB_POOL_LINK=link
      - name: Build the targets the LLVM subset runs
        run: |
          targets="$(python3 scripts/validation_checks.py test-targets --build build-sanitized --regex "${GTI_LLVM_SANITIZER_TESTS}")"
          read -r -a target_list <<< "${targets}"
          cmake --build build-sanitized --parallel "${GTI_JOBS}" --target gti "${target_list[@]}"
      - name: Test the LLVM backend under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized --output-on-failure --no-tests=error
          --output-junit "${RUNNER_TEMP}/sanitizers-llvm.xml"
          --parallel "${GTI_TEST_JOBS}" -R "${GTI_LLVM_SANITIZER_TESTS}"
      - name: Preserve sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers-llvm
          path: |
            ${{ runner.temp }}/sanitizers-llvm.xml
            build-sanitized/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 30
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

  tsan:
    # The threads/atomics/TLS runtime under ThreadSanitizer on the shipping
    # backend. The compiler itself is uninstrumented (it is not what TSan
    # checks); the `_tsan` harnesses compile the emitted LLVM IR with
    # -fsanitize=thread. Every earlier CI configure set this OFF, which made
    # all ten tests no-ops.
    name: Thread sanitizer
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GTI_TEST_BACKENDS: llvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 2048
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/native
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=ON
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Build
        run: cmake --build build --parallel "${GTI_JOBS}"
      - name: Run the thread-sanitizer suite
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          --output-junit "${RUNNER_TEMP}/tsan.xml"
          --parallel "${GTI_TEST_JOBS}" -R '_tsan$'
      - name: Require every thread-sanitizer test to run
        # A harness exits 77 (CTest "skipped") when the native compiler has
        # no -fsanitize=thread runtime; the first run on main passed 10/10
        # with five of them skipped. Skips are a missing runtime, not evidence.
        run: |
          python3 - "${RUNNER_TEMP}/tsan.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          skipped_names = [case.get("name") for case in suite.iter("testcase") if case.find("skipped") is not None]
          print(f"thread-sanitizer tests: {tests}, skipped: {skipped} {skipped_names}")
          if tests < 1 or skipped or skipped_names:
              sys.exit("every registered _tsan test must execute under ThreadSanitizer")
          PY
      - name: Preserve TSan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizers-tsan
          path: ${{ runner.temp }}/tsan.xml
          if-no-files-found: warn
          retention-days: 30

  verdict:
    # Collects every shard and sanitizer artifact and applies the same
    # acceptance the merge gate used to apply to these jobs.
    name: Full validation verdict
    if: always()
    needs: [plan, package, integration, sanitizers, llvm-sanitizers, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - name: Refresh the shard duration table from this run
        run: >-
          python3 scripts/validation_checks.py durations
          --reports "${RUNNER_TEMP}/shards"
      - name: Upload the refreshed duration table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-durations
          path: tests/ci_test_durations.json
          retention-days: 30
      - name: Decide full validation acceptance
        env:
          GTI_VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
          GTI_VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/validation_checks.py ci-gate --mode "${GTI_VALIDATION_MODE}"
          --results "${GTI_VALIDATION_RESULTS}" --event full_validation
          --shard-reports "${RUNNER_TEMP}/shards"

  report:
    # A red main must be visible without anyone watching the Actions tab:
    # one `main-broken` issue is opened or updated on failure and closed when
    # main is green again. A cancelled run reports nothing.
    name: Report main status
    if: always() && github.event_name == 'push' && needs.verdict.result != 'cancelled'
    needs: [verdict]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the main-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
          GTI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GTI_BEFORE: ${{ github.event.before }}
          GTI_SHA: ${{ github.sha }}
          GTI_STATUS: ${{ needs.verdict.result == 'success' && 'passed' || 'failed' }}
        run: >-
          python3 scripts/full_validation_report.py --run-url "${GTI_RUN_URL}"
          --before "${GTI_BEFORE}" --sha "${GTI_SHA}" --status "${GTI_STATUS}"

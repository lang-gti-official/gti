name: Full validation

# The complete suite, run after integration on every main head (and on
# dispatch), never as the merge gate. This is the Rust/LLVM model: the merge
# queue proves build and fast checks on the exact candidate; this workflow
# proves production packaging and every bundled-release integration shard on
# both platforms on the merged result, and produces the packages the nightly,
# beta and release-train channels publish. Runtime harnesses run at -O0
# only, and tests labelled `slow` are left out: the daily slow tier
# (slow.yml) runs them and the -O3 re-run on the nightly commit, as the
# compiler, LLVM-backend and thread sanitizers run once a day there
# (sanitizers.yml); the release train requires both verdicts. A failure
# opens (or updates) a `main-broken` issue naming the commit range; it never
# blocks the queue, and a channel never selects a main commit this workflow
# has not passed. Required jobs that never got a hosted runner are re-run once
# by validation-retry.yml rather than reported. See
# docs/architecture/agent-workflow.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # One group per commit: every main push starts its own run at once and is
  # never cancelled or replaced by a later push, so each commit gets a verdict
  # and its packages reach tip without waiting for an earlier run (a single
  # group per branch keeps only one pending run, which dropped the middle
  # commit whenever main advanced twice during a run, and held a merge's
  # packages for up to a whole run). A second dispatch of the same commit
  # still waits for the first. Runs therefore finish in any order: tip
  # admission, nightly selection and the main-broken report decide by commit
  # ancestry on main, never by which run finished last.
  group: full-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a main head
        id: plan
        run: |
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          echo 'mode=full' >> "${GITHUB_OUTPUT}"
      - name: Select the shard duration table
        # Every shard of this run balances from one table: the newest table an
        # earlier full validation refreshed (its `ci-test-durations` artifact),
        # or the committed one. Committing each refresh is unnecessary, and a
        # stale committed table left 151 tests at the 30-second default (run
        # 41910246551: 99-182 summed minutes across six shards). The table only
        # orders and partitions tests; it never changes what runs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetched="${RUNNER_TEMP}/fetched-durations"
          runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow full-validation.yml \
            --branch main --status completed --limit 10 --json databaseId --jq '.[].databaseId' || true)"
          for run in ${runs}; do
            [[ "${run}" == "${GITHUB_RUN_ID}" ]] && continue
            rm -rf "${fetched}"
            if gh run download "${run}" --repo "${GITHUB_REPOSITORY}" --name ci-test-durations \
                 --dir "${fetched}" 2>/dev/null &&
               python3 scripts/validation_checks.py check-durations "${fetched}/ci_test_durations.json"; then
              cp "${fetched}/ci_test_durations.json" tests/ci_test_durations.json
              echo "Shard durations from full validation run ${run}"
              exit 0
            fi
          done
          echo "::notice::No earlier refreshed duration table; using the committed one"
          python3 scripts/validation_checks.py check-durations tests/ci_test_durations.json
      - name: Share the duration table with every shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-durations
          path: tests/ci_test_durations.json
          retention-days: 7
  package:
    name: Release package (${{ matrix.platform }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # linux-arm64 is not packaged: runtime/src/atomic_lane.h has no
        # reviewed linux-aarch64 compiler profile, so configure_ci_toolchain.sh
        # cannot admit a compiler there. See build-and-driver.md.
        include:
          - {os: ubuntu-24.04, platform: linux-x64, host: Linux-X64}
          - {os: macos-26, platform: darwin-arm64, host: macOS-ARM64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the exact nightly source and runner
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_EXPECTED_HOST: ${{ matrix.host }}
        run: |
          if [[ "${RUNNER_OS}-${RUNNER_ARCH}" != "${GTI_EXPECTED_HOST}" ]]; then
            echo "Runner ${RUNNER_OS}-${RUNNER_ARCH} is not ${GTI_EXPECTED_HOST}" >&2
            exit 1
          fi
          python3 scripts/resolve_release_source.py source --sha "${GTI_NIGHTLY_SHA}" \
            --event nightly --output "${RUNNER_TEMP}/gti-source"
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # The bundled LLVM/Clang build compiles its large units beside GTI's.
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler and LLVM/Clang object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Check native driver compilation before LLVM/Clang
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o
      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"
      - name: Stage toolchain
        run: |
          stage="$(mktemp -d "${RUNNER_TEMP}/gti-stage.XXXXXXXX")"
          printf 'GTI_STAGE_DIRECTORY=%s\n' "${stage}" >> "${GITHUB_ENV}"
          cmake --install build --config Release --prefix "${stage}" --component gti_toolchain
      - name: Test installed toolchain
        run: |
          export PATH="${GTI_STAGE_DIRECTORY}/bin:${PATH}"
          source="${GITHUB_WORKSPACE}"
          cd "${RUNNER_TEMP}"
          python3 "${source}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${source}/tests/cli_smoke_test.py" gti
          python3 "${source}/tests/project_cli_smoke_test.py" gti
          python3 "${source}/tests/project/standard_library_bundle/verify_stage.py" "${GTI_STAGE_DIRECTORY}"
          python3 "${source}/tests/process_resource_policy_test.py" gti --installed
          python3 "${source}/tests/managed_thread_runtime_test.py" gti
          python3 "${source}/tests/atomic_runtime_test.py" gti \
            "${source}/tests/fixtures/atomic_scalar.gti" \
            "${source}/tests/fixtures/atomic_concurrent.gti" \
            "${source}/tests/fixtures/atomic_orders.gti" \
            "${source}/tests/fixtures/atomic_fetch.gti" \
            "${source}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake -S "${source}/tests/installed_library_smoke" \
            -B "${RUNNER_TEMP}/gti-installed-library-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GTI_STAGE_DIRECTORY}"
          cmake --build "${RUNNER_TEMP}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest --test-dir "${RUNNER_TEMP}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure
      - name: Create nightly archive from the validated stage
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_PLATFORM: ${{ matrix.platform }}
        run: >-
          cmake
          -DGTI_SOURCE_DIR="${GITHUB_WORKSPACE}"
          -DGTI_STAGE_DIR="${GTI_STAGE_DIRECTORY}"
          -DGTI_OUTPUT_DIR="${GITHUB_WORKSPACE}/dist/nightly"
          -DGTI_PLATFORM="${GTI_PLATFORM}"
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID="${GTI_NIGHTLY_SHA}"
          -P cmake/PackageRelease.cmake
      - name: Record package identity and checksums
        env:
          GTI_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release_artifacts.py record --directory dist/nightly --platform "${GTI_PLATFORM}"
      - name: Verify deterministic API generation
        if: matrix.platform == 'linux-x64'
        run: |
          cmake --build build --parallel "${GTI_JOBS}" --target gti_docgen
          build/gti_docgen --stdlib stdlib --output build/documentation-index.json
          build/gti_docgen --stdlib stdlib --output build/documentation-index-repeat.json
          cmp build/documentation-index.json build/documentation-index-repeat.json
          mkdir -p dist/reference
          cp build/documentation-index.json dist/reference/gti-tip-documentation-index.json
          python3 scripts/release_artifacts.py reference --directory dist/nightly --output dist/reference
      - name: Retain the verified Linux API index and its package identity
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/reference/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload nightly archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-${{ matrix.platform }}-${{ github.run_attempt }}
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 30
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi
      # llvm-prebuilt.yml owns the release cache under its toolchain-content
      # key; a validation run only restores it. Saving a per-run key here
      # evicted the reachable entries from the 10 GB cache.

  tip:
    # The tip channel: this commit's production archives, published as soon as
    # both platforms built and passed their installed-toolchain checks, without
    # waiting for the integration shards. It claims nothing about the complete
    # suite; nightly remains the newest commit that passed it and later serves
    # the same archive bytes. A publication failure never changes this run's
    # verdict, so it cannot keep nightly from selecting the commit.
    name: Tip toolchain
    needs: [package]
    if: github.event_name == 'push' && github.repository == 'lang-gti-official/gti'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No concurrency group: a job-level group keeps one pending job and cancels
    # it when another arrives, which would cancel this whole run (and lose its
    # nightly evidence) and could drop a newer commit's publication for an
    # older one's. Ordering is explicit instead: the claim skips a commit the
    # published tip already descends from, and a claimed publication waits for
    # older in-progress ones, so the newest claim uploads last.
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GTI_TIP_SHA: ${{ github.sha }}
    steps:
      - name: Check out the packaged commit with main's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download this run's archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gti-nightly-*-${{ github.run_attempt }}
          path: dist/nightly
          merge-multiple: true
      - name: Verify package provenance and name the tip assets
        env:
          GTI_SOURCE_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 scripts/release_artifacts.py tip --directory dist/nightly
          --output dist/tip --sha "${GTI_TIP_SHA}" --run-id "${GITHUB_RUN_ID}"
          --attempt "${GTI_SOURCE_ATTEMPT}" --repository "${GITHUB_REPOSITORY}"
      - name: Download the matching Linux reference assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gti-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/tip
      # Admission skips a commit older than the published tip (one the tip
      # descends from). The tag moves through a lease on the exact value
      # admission read (empty: the tag must not exist yet); a lease lost to a
      # concurrent publication is decided again, never forced.
      - name: Claim the tip tag for a main commit no older than the published tip, including a retry
        id: admission
        run: >-
          python3 scripts/resolve_release_source.py claim-tip
          --sha "${GTI_TIP_SHA}" --output "${GITHUB_OUTPUT}"
      - name: Wait for older tip publications to finish uploading
        if: steps.admission.outputs.publish == 'true'
        env:
          GTI_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/resolve_release_source.py await-tip
          --sha "${GTI_TIP_SHA}" --repository "${GITHUB_REPOSITORY}"
          --run-id "${GITHUB_RUN_ID}" --output "${GITHUB_OUTPUT}"
      - name: Publish the tip release and its assets
        if: steps.admission.outputs.publish == 'true'
        run: |
          # A newer commit's claim takes over: stop before any further upload
          # (its job waits for this one to end, then uploads last).
          still_tip() {
            named="$(git ls-remote origin refs/tags/tip 'refs/tags/tip^{}' | awk '{ sha = $1 } END { print sha }')"
            [[ "${named}" == "${GTI_TIP_SHA}" ]] && return 0
            echo "::notice title=Tip::tip now names ${named}; leaving publication to that newer commit"
            return 1
          }
          still_tip || exit 0
          {
            printf 'Rolling build of the newest GitHub `main` commit whose release packages built and passed their installed-toolchain checks.\n\n'
            printf 'The complete test suite has **not** run on this build. Use `nightly` for the newest commit that passed it.\n\n'
            printf -- '- commit: `%s`\n' "${GTI_TIP_SHA}"
            printf -- '- version at build: `%s`\n' "$(cat VERSION)"
          } > "${RUNNER_TEMP}/tip-notes.md"
          if gh release view tip --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit tip --repo "${GITHUB_REPOSITORY}" --prerelease \
              --latest=false --title "GTI tip" --notes-file "${RUNNER_TEMP}/tip-notes.md"
          else
            gh release create tip --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease \
              --latest=false --title "GTI tip" --notes-file "${RUNNER_TEMP}/tip-notes.md"
          fi
          # Archives first, BUILD_ID last: an installer that reads the new
          # BUILD_ID finds the matching archives. A download racing this step
          # fails its identity or checksum check and installs nothing.
          for asset in dist/tip/gti-tip-*; do
            still_tip || exit 0
            gh release upload tip --repo "${GITHUB_REPOSITORY}" --clobber "${asset}"
          done
          still_tip || exit 0
          gh release upload tip --repo "${GITHUB_REPOSITORY}" --clobber dist/tip/BUILD_ID

  integration:
    name: Integration (${{ matrix.platform }} ${{ matrix.index }}/${{ matrix.shards }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 0}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 1}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 2}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 3}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 4}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 5}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 6}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 7}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 8}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 9}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 10}
          - {os: ubuntu-24.04, platform: linux, shards: 12, index: 11}
          - {os: macos-26, platform: darwin, shards: 6, index: 0}
          - {os: macos-26, platform: darwin, shards: 6, index: 1}
          - {os: macos-26, platform: darwin, shards: 6, index: 2}
          - {os: macos-26, platform: darwin, shards: 6, index: 3}
          - {os: macos-26, platform: darwin, shards: 6, index: 4}
          - {os: macos-26, platform: darwin, shards: 6, index: 5}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use this run's shard duration table
        # Before configure: TestThroughput.cmake reads it for CTest COST hints.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-durations
          path: tests
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the prebuilt LLVM/Clang and release object cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure release build
        # Hosted runners are slower than the hosts test bounds were measured on;
        # scale them as the merge queue does.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Run this shard of the complete release suite
        env:
          GTI_SHARDS: ${{ matrix.shards }}
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
          GTI_SHARD_TEST_SET: ${{ matrix.platform == 'darwin' && 'darwin' || 'full' }}
        run: >-
          python3 scripts/validation_checks.py shard --build build
          --test-set "${GTI_SHARD_TEST_SET}"
          --shards "${GTI_SHARDS}" --index "${GTI_SHARD_INDEX}"
          --jobs "${GTI_TEST_JOBS}"
          --report "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.json"
          --log "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log"
      - name: Show the shard log on failure
        if: failure()
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: tail -n 400 "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log" || true
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.platform }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/shard/*.json
            ${{ runner.temp }}/shard/*.xml
          retention-days: 30
          if-no-files-found: ignore

  verdict:
    # Collects every shard artifact and applies the same acceptance the merge
    # gate used to apply to these jobs. The sanitizers run daily on the
    # nightly commit in sanitizers.yml, never on every main push.
    name: Full validation verdict
    if: always()
    needs: [plan, package, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - name: Start from this run's shard duration table
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-durations
          path: tests
      - name: Refresh the shard duration table from this run
        run: >-
          python3 scripts/validation_checks.py durations
          --reports "${RUNNER_TEMP}/shards"
      - name: Upload the refreshed duration table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-durations
          path: tests/ci_test_durations.json
          retention-days: 30
      - name: Report advisory census drift
        # Census budgets are reviewed counts that ordinary changes move; a
        # drifted pin passes its test and prints `GTI-ADVISORY:`, which this
        # turns into warnings. It never fails the verdict.
        continue-on-error: true
        run: python3 scripts/validation_checks.py advisories --reports "${RUNNER_TEMP}/shards"
      - name: Decide full validation acceptance
        env:
          GTI_VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
          GTI_VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/validation_checks.py ci-gate --mode "${GTI_VALIDATION_MODE}"
          --results "${GTI_VALIDATION_RESULTS}" --event full_validation
          --shard-reports "${RUNNER_TEMP}/shards"

  report:
    # A red main must be visible without anyone watching the Actions tab:
    # one `main-broken` issue is opened or updated on failure and closed when
    # main is green again. A cancelled run reports nothing. A run that is red
    # only because required jobs never got a runner (zero steps executed) is
    # left to validation-retry.yml, which re-runs those jobs once when this is
    # the newest run of main; the re-run attempt reports again. Runs of
    # several commits overlap, so a result is applied only while no newer
    # main commit (a descendant) has its own verdict (`--repository`).
    name: Report main status
    if: always() && github.event_name == 'push' && needs.verdict.result != 'cancelled'
    needs: [verdict]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Leave a run that only lacked runners to the retry
        id: retry
        if: needs.verdict.result != 'success'
        # Any doubt reports: if this step breaks, the issue step still runs.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/validation_retry.py defer --repository "${GITHUB_REPOSITORY}"
          --run-id "${GITHUB_RUN_ID}" --attempt "${GITHUB_RUN_ATTEMPT}" --output "${GITHUB_OUTPUT}"
      - name: Open, update or close the main-broken issue
        if: steps.retry.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GTI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GTI_BEFORE: ${{ github.event.before }}
          GTI_SHA: ${{ github.sha }}
          GTI_STATUS: ${{ needs.verdict.result == 'success' && 'passed' || 'failed' }}
        run: >-
          python3 scripts/full_validation_report.py --run-url "${GTI_RUN_URL}"
          --before "${GTI_BEFORE}" --sha "${GTI_SHA}" --status "${GTI_STATUS}"
          --repository "${GITHUB_REPOSITORY}"

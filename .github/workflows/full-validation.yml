name: Full validation

# The complete suite, run after integration on every main head (and on
# dispatch), never as the merge gate. This is the Rust/LLVM model: the merge
# queue proves build and fast checks on the exact candidate; this workflow
# proves production packaging and every bundled-release integration shard on
# both platforms on the merged result, and produces the packages the nightly,
# beta and release-train channels publish. The compiler, LLVM-backend and
# thread sanitizers run once a day on the nightly commit instead
# (sanitizers.yml), and the release train requires their verdict. A failure
# opens (or updates) a `main-broken` issue naming the commit range; it never
# blocks the queue, and a channel never selects a main commit this workflow
# has not passed. See docs/architecture/agent-workflow.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Runs queue rather than cancel. The merge queue batches merges, so main can
  # advance several times inside one full-validation run; cancelling the older
  # run on every push left no head ever proven (the first run on the split
  # gate was cancelled at 42 minutes). A superseded head's verdict is still
  # evidence for the channels, and the newest head follows it.
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validation plan
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a main head
        id: plan
        run: |
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || exit 1
          echo 'mode=full' >> "${GITHUB_OUTPUT}"
  package:
    name: Release package (${{ matrix.platform }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        # linux-arm64 is not packaged: runtime/src/atomic_lane.h has no
        # reviewed linux-aarch64 compiler profile, so configure_ci_toolchain.sh
        # cannot admit a compiler there. See build-and-driver.md.
        include:
          - {os: ubuntu-24.04, platform: linux-x64, host: Linux-X64}
          - {os: macos-26, platform: darwin-arm64, host: macOS-ARM64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm the exact nightly source and runner
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_EXPECTED_HOST: ${{ matrix.host }}
        run: |
          if [[ "${RUNNER_OS}-${RUNNER_ARCH}" != "${GTI_EXPECTED_HOST}" ]]; then
            echo "Runner ${RUNNER_OS}-${RUNNER_ARCH} is not ${GTI_EXPECTED_HOST}" >&2
            exit 1
          fi
          python3 scripts/resolve_release_source.py source --sha "${GTI_NIGHTLY_SHA}" \
            --event nightly --output "${RUNNER_TEMP}/gti-source"
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # The bundled LLVM/Clang build compiles its large units beside GTI's.
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler and LLVM/Clang object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --cxx "${CXX}" --sanitizer address,undefined
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Check native driver compilation before LLVM/Clang
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o
      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"
      - name: Stage toolchain
        run: |
          stage="$(mktemp -d "${RUNNER_TEMP}/gti-stage.XXXXXXXX")"
          printf 'GTI_STAGE_DIRECTORY=%s\n' "${stage}" >> "${GITHUB_ENV}"
          cmake --install build --config Release --prefix "${stage}" --component gti_toolchain
      - name: Test installed toolchain
        run: |
          export PATH="${GTI_STAGE_DIRECTORY}/bin:${PATH}"
          source="${GITHUB_WORKSPACE}"
          cd "${RUNNER_TEMP}"
          python3 "${source}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${source}/tests/cli_smoke_test.py" gti
          python3 "${source}/tests/project_cli_smoke_test.py" gti
          python3 "${source}/tests/process_resource_policy_test.py" gti --installed
          python3 "${source}/tests/managed_thread_runtime_test.py" gti
          python3 "${source}/tests/atomic_runtime_test.py" gti \
            "${source}/tests/fixtures/atomic_scalar.gti" \
            "${source}/tests/fixtures/atomic_concurrent.gti" \
            "${source}/tests/fixtures/atomic_orders.gti" \
            "${source}/tests/fixtures/atomic_fetch.gti" \
            "${source}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake -S "${source}/tests/installed_library_smoke" \
            -B "${RUNNER_TEMP}/gti-installed-library-smoke" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GTI_STAGE_DIRECTORY}"
          cmake --build "${RUNNER_TEMP}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest --test-dir "${RUNNER_TEMP}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure
      - name: Create nightly archive from the validated stage
        env:
          GTI_NIGHTLY_SHA: ${{ github.sha }}
          GTI_PLATFORM: ${{ matrix.platform }}
        run: >-
          cmake
          -DGTI_SOURCE_DIR="${GITHUB_WORKSPACE}"
          -DGTI_STAGE_DIR="${GTI_STAGE_DIRECTORY}"
          -DGTI_OUTPUT_DIR="${GITHUB_WORKSPACE}/dist/nightly"
          -DGTI_PLATFORM="${GTI_PLATFORM}"
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID="${GTI_NIGHTLY_SHA}"
          -P cmake/PackageRelease.cmake
      - name: Record package identity and checksums
        env:
          GTI_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/release_artifacts.py record --directory dist/nightly --platform "${GTI_PLATFORM}"
      - name: Upload nightly archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gti-nightly-${{ matrix.platform }}-${{ github.run_attempt }}
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 30
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi
      # llvm-prebuilt.yml owns the release cache under its toolchain-content
      # key; a validation run only restores it. Saving a per-run key here
      # evicted the reachable entries from the 10 GB cache.

  integration:
    name: Integration (${{ matrix.platform }} ${{ matrix.index }}/${{ matrix.shards }})
    needs: [plan]
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 0}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 1}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 2}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 3}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 4}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 5}
          # macOS proves only what differs on the platform (the `darwin` test
          # set: AArch64 LLVM backend, Apple-only tests, threads/TLS/atomics,
          # debug info, install/bundle/link, ABI/layout). Linux proves the
          # rest once. See AGENTS.md "Validation".
          - {os: macos-26, platform: darwin, shards: 2, index: 0}
          - {os: macos-26, platform: darwin, shards: 2, index: 1}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      - name: Restore the prebuilt LLVM/Clang and release object cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure release build
        # Hosted runners are slower than the hosts test bounds were measured on;
        # scale them as the merge queue does.
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Run this shard of the complete release suite
        env:
          GTI_SHARDS: ${{ matrix.shards }}
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
          GTI_SHARD_TEST_SET: ${{ matrix.platform == 'darwin' && 'darwin' || 'full' }}
        run: >-
          GTI_TEST_BACKENDS=llvm
          python3 scripts/validation_checks.py shard --build build
          --test-set "${GTI_SHARD_TEST_SET}"
          --shards "${GTI_SHARDS}" --index "${GTI_SHARD_INDEX}"
          --jobs "${GTI_TEST_JOBS}"
          --report "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.json"
          --log "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log"
      - name: Show the shard log on failure
        if: failure()
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: tail -n 400 "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log" || true
      - name: Verify deterministic API generation
        if: matrix.platform == 'linux' && matrix.index == 0
        run: |
          cmake --build build --parallel "${GTI_JOBS}" --target gti_docgen
          build/gti_docgen --stdlib stdlib --output build/documentation-index.json
          build/gti_docgen --stdlib stdlib --output build/documentation-index-repeat.json
          cmp build/documentation-index.json build/documentation-index-repeat.json
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.platform }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/shard/*.json
            ${{ runner.temp }}/shard/*.xml
          retention-days: 30
          if-no-files-found: ignore

  verdict:
    # Collects every shard artifact and applies the same acceptance the merge
    # gate used to apply to these jobs. The sanitizers run daily on the
    # nightly commit in sanitizers.yml, never on every main push.
    name: Full validation verdict
    if: always()
    needs: [plan, package, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - name: Refresh the shard duration table from this run
        run: >-
          python3 scripts/validation_checks.py durations
          --reports "${RUNNER_TEMP}/shards"
      - name: Upload the refreshed duration table
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-durations
          path: tests/ci_test_durations.json
          retention-days: 30
      - name: Report advisory census drift
        # Census budgets are reviewed counts that ordinary changes move; a
        # drifted pin passes its test and prints `GTI-ADVISORY:`, which this
        # turns into warnings. It never fails the verdict.
        continue-on-error: true
        run: python3 scripts/validation_checks.py advisories --reports "${RUNNER_TEMP}/shards"
      - name: Decide full validation acceptance
        env:
          GTI_VALIDATION_MODE: ${{ needs.plan.outputs.mode }}
          GTI_VALIDATION_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/validation_checks.py ci-gate --mode "${GTI_VALIDATION_MODE}"
          --results "${GTI_VALIDATION_RESULTS}" --event full_validation
          --shard-reports "${RUNNER_TEMP}/shards"

  report:
    # A red main must be visible without anyone watching the Actions tab:
    # one `main-broken` issue is opened or updated on failure and closed when
    # main is green again. A cancelled run reports nothing.
    name: Report main status
    if: always() && github.event_name == 'push' && needs.verdict.result != 'cancelled'
    needs: [verdict]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open, update or close the main-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
          GTI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GTI_BEFORE: ${{ github.event.before }}
          GTI_SHA: ${{ github.sha }}
          GTI_STATUS: ${{ needs.verdict.result == 'success' && 'passed' || 'failed' }}
        run: >-
          python3 scripts/full_validation_report.py --run-url "${GTI_RUN_URL}"
          --before "${GTI_BEFORE}" --sha "${GTI_SHA}" --status "${GTI_STATUS}"

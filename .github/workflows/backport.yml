name: Backport

# A pull request into a beta/<major>.<minor> line, labelled `backport`, must
# consist of `git cherry-pick -x` copies of commits already on main
# (scripts/release_train.py backport-check, run from main's copy of the
# script), optionally ending with a patch release cut. It then runs the
# complete suite on the release configuration in the nightly's shards.
# "Backport gate" is the check the proposed beta/* ruleset requires, beside
# "CI gate"; the main ruleset and merge queue do not cover beta/*. Once the
# pull request merges, beta.yml publishes the line's next beta. Like CI, this
# runs pull-request content only with a read-only token and no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches:
      - "beta/**"

permissions:
  contents: read

concurrency:
  group: backport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backport provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit against main with main's own checker
        env:
          GTI_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [[ -z "${GTI_EVENT_PATH}" || ! -f "${GTI_EVENT_PATH}" ]]; then
            echo "The event payload must name an existing file." >&2
            exit 1
          fi
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          checker="$(mktemp -d "${RUNNER_TEMP}/gti-backport.XXXXXXXX")"
          for file in release_train.py resolve_release_source.py cut_release.py; do
            git show "refs/remotes/origin/main:scripts/${file}" > "${checker}/${file}"
          done
          python3 "${checker}/release_train.py" backport-check --event "${GTI_EVENT_PATH}"

  suite:
    name: Release suite (${{ matrix.platform }} ${{ matrix.index }}/${{ matrix.shards }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 0}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 1}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 2}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 3}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 4}
          - {os: ubuntu-24.04, platform: linux, shards: 6, index: 5}
          - {os: macos-26, platform: darwin, shards: 5, index: 0}
          - {os: macos-26, platform: darwin, shards: 5, index: 1}
          - {os: macos-26, platform: darwin, shards: 5, index: 2}
          - {os: macos-26, platform: darwin, shards: 5, index: 3}
          - {os: macos-26, platform: darwin, shards: 5, index: 4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh
      # Restore only: a pull request never writes the release cache.
      - name: Restore the release object cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=3
      - name: Run this shard of the complete release suite
        env:
          GTI_SHARDS: ${{ matrix.shards }}
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: >-
          python3 scripts/validation_checks.py shard --build build
          --shards "${GTI_SHARDS}" --index "${GTI_SHARD_INDEX}"
          --jobs "${GTI_TEST_JOBS}"
          --report "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.json"
          --log "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log"
      - name: Show the shard log on failure
        if: failure()
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
          GTI_SHARD_PLATFORM: ${{ matrix.platform }}
        run: tail -n 400 "${RUNNER_TEMP}/shard/${GTI_SHARD_PLATFORM}-${GTI_SHARD_INDEX}.log" || true
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backport-shard-${{ matrix.platform }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/shard/*.json
            ${{ runner.temp }}/shard/*.xml
          retention-days: 30
          if-no-files-found: ignore

  gate:
    # The status check the beta/* ruleset requires.
    name: Backport gate
    if: always()
    needs: [verify, suite]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require provenance and the whole suite
        env:
          GTI_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/release_train.py require-success --results "${GTI_RESULTS}"
      - name: Collect shard evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backport-shard-*
          path: ${{ runner.temp }}/shards
      - name: Require every release test to have run once per platform
        env:
          GTI_HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/validation_checks.py merge-shards
          --shard-reports "${RUNNER_TEMP}/shards" --platforms darwin,linux
          --head "${GTI_HEAD_SHA}"

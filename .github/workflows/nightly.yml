name: Nightly toolchain

# Publishes the exact production archives retained by successful full CI on
# current main. No compiler build or full suite runs here. Missing/expired
# artifacts require a fresh full CI dispatch on main, never a validation bypass.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-hex main commit to publish (default main head). Only main head publishes.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  select:
    name: Select a full-CI-validated main commit
    if: github.repository == 'lang-gti-official/gti'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      version: ${{ steps.select.outputs.version }}
      build: ${{ steps.select.outputs.build }}
      head: ${{ steps.select.outputs.head }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release orchestration before publishing
        run: python3 tests/ci_release_test.py .
      - name: Select the commit and verify its full CI and retained packages
        id: select
        env:
          GTI_GITHUB_TOKEN: ${{ github.token }}
          GTI_REPOSITORY: ${{ github.repository }}
          GTI_EVENT_NAME: ${{ github.event_name }}
          GTI_REF: ${{ github.ref }}
          GTI_REQUESTED_COMMIT: ${{ inputs.commit }}
        run: >-
          python3 scripts/resolve_release_source.py select-nightly
          --repository "${GTI_REPOSITORY}" --event "${GTI_EVENT_NAME}"
          --ref "${GTI_REF}" --requested "${GTI_REQUESTED_COMMIT}"
          --output "${GITHUB_OUTPUT}"

  publish:
    name: Publish the nightly prerelease
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: gti-nightly-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GTI_NIGHTLY_SHA: ${{ needs.select.outputs.sha }}
      GTI_NIGHTLY_VERSION: ${{ needs.select.outputs.version }}
      GTI_NIGHTLY_PLATFORMS: linux-x64 darwin-arm64
    steps:
      - name: Check out the packaged commit with main's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.sha }}
          fetch-depth: 0
      - name: Download nightly archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run_id }}
          pattern: gti-nightly-*-${{ needs.select.outputs.run_attempt }}
          path: dist
          merge-multiple: true
      - name: Verify integration provenance before publication
        env:
          GTI_SOURCE_RUN: ${{ needs.select.outputs.run_id }}
          GTI_SOURCE_ATTEMPT: ${{ needs.select.outputs.run_attempt }}
        run: >-
          python3 scripts/release_artifacts.py verify --directory dist
          --sha "${GTI_NIGHTLY_SHA}" --run-id "${GTI_SOURCE_RUN}"
          --attempt "${GTI_SOURCE_ATTEMPT}" --repository "${GITHUB_REPOSITORY}" --consume
      - name: Verify the complete asset set and record BUILD_ID
        run: |
          expected=()
          for platform in ${GTI_NIGHTLY_PLATFORMS}; do
            archive="gti-nightly-${platform}.tar.gz"
            (cd dist && shasum -a 256 -c "${archive}.sha256")
            stamped="$(tar -xOzf "dist/${archive}" ./share/gti/BUILD_ID)"
            if [[ "${stamped}" != "${GTI_NIGHTLY_SHA}" ]]; then
              echo "${archive} was built from ${stamped}, not ${GTI_NIGHTLY_SHA}" >&2
              exit 1
            fi
            expected+=("${archive}" "${archive}.sha256")
          done
          printf '%s\n' "${GTI_NIGHTLY_SHA}" > dist/BUILD_ID
          expected+=(BUILD_ID)
          actual="$(cd dist && ls -1 | LC_ALL=C sort)"
          wanted="$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)"
          if [[ "${actual}" != "${wanted}" ]]; then
            printf 'Unexpected nightly asset set:\n%s\n' "${actual}" >&2
            exit 1
          fi
      - name: Admit current main, including a retry of interrupted publication
        id: admission
        run: >-
          python3 scripts/resolve_release_source.py admit-nightly
          --sha "${GTI_NIGHTLY_SHA}" --output "${GITHUB_OUTPUT}"
      - name: Attest build provenance
        if: steps.admission.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gti-nightly-*.tar.gz
      # The lease names the exact tag value admission read (empty: the tag
      # must not exist yet), so a concurrent or stale move fails, not wins.
      - name: Advance the nightly tag
        if: steps.admission.outputs.publish == 'true'
        env:
          GTI_NIGHTLY_LEASE: ${{ steps.admission.outputs.lease }}
        run: >-
          git push --porcelain
          "--force-with-lease=refs/tags/nightly:${GTI_NIGHTLY_LEASE}"
          origin "${GTI_NIGHTLY_SHA}:refs/tags/nightly"
      - name: Publish the nightly release and its assets
        if: steps.admission.outputs.publish == 'true'
        run: |
          {
            printf 'Rolling build of GitHub `main` that passed full integration CI.\n\n'
            printf -- '- commit: `%s`\n' "${GTI_NIGHTLY_SHA}"
            printf -- '- version at build: `%s`\n' "${GTI_NIGHTLY_VERSION}"
            printf -- '- platforms: %s\n\n' "${GTI_NIGHTLY_PLATFORMS}"
            printf 'Use a versioned release for anything that needs to stay put.\n'
          } > "${RUNNER_TEMP}/nightly-notes.md"
          if gh release view nightly --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit nightly --repo "${GITHUB_REPOSITORY}" --prerelease \
              --latest=false --title "GTI nightly" --notes-file "${RUNNER_TEMP}/nightly-notes.md"
          else
            gh release create nightly --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease \
              --latest=false --title "GTI nightly" --notes-file "${RUNNER_TEMP}/nightly-notes.md"
          fi
          # Archives first, BUILD_ID last: an installer that reads the new
          # BUILD_ID finds the matching archives. A download racing this step
          # fails its identity or checksum check and installs nothing.
          for platform in ${GTI_NIGHTLY_PLATFORMS}; do
            gh release upload nightly --repo "${GITHUB_REPOSITORY}" --clobber \
              "dist/gti-nightly-${platform}.tar.gz" "dist/gti-nightly-${platform}.tar.gz.sha256"
          done
          gh release upload nightly --repo "${GITHUB_REPOSITORY}" --clobber dist/BUILD_ID
      - name: Remove assets outside this nightly build
        if: steps.admission.outputs.publish == 'true'
        run: |
          published="$(gh release view nightly --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          # Prune only after every current asset is present.
          for name in $(cd dist && ls -1); do
            if ! grep -Fxq -- "${name}" <<< "${published}"; then
              echo "${name} was not uploaded; refusing to prune the release" >&2
              exit 1
            fi
          done
          while IFS= read -r name; do
            if [[ -n "${name}" && ! -f "dist/${name}" ]]; then
              gh release delete-asset nightly "${name}" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done <<< "${published}"

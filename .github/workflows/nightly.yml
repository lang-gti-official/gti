name: Nightly

# The nightly channel republishes one release per commit on main. Its tag is
# always `nightly` and its assets are replaced in place, so the channel never
# accumulates releases. Versioned releases stay in release.yml and remain the
# only channel whose tag records a VERSION.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer commit supersedes an in-flight nightly: publishing an older build
# after a newer one would leave the channel pointing at stale artifacts.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_PATH: sccache

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure release build
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test build tree
        run: >-
          ctest --test-dir build -C Release
          --parallel 4 --output-on-failure

      - name: Stage toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-stage"
          --component gti_toolchain

      - name: Test installed toolchain
        run: |
          export PATH="${{ runner.temp }}/gti-stage/bin:${PATH}"
          cd "${{ runner.temp }}"
          python3 "${{ github.workspace }}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${{ github.workspace }}/tests/cli_smoke_test.py" gti
          python3 "${{ github.workspace }}/tests/project_cli_smoke_test.py" gti
          cmake \
            -S "${{ github.workspace }}/tests/installed_library_smoke" \
            -B "${{ runner.temp }}/gti-installed-library-smoke" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-stage"
          cmake --build \
            "${{ runner.temp }}/gti-installed-library-smoke" \
            --config Release
          ctest \
            --test-dir "${{ runner.temp }}/gti-installed-library-smoke" \
            -C Release --parallel 4 --output-on-failure

      - name: Create nightly archive
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ github.workspace }}
          -DGTI_STAGE_DIR=${{ runner.temp }}/gti-stage
          -DGTI_OUTPUT_DIR=${{ github.workspace }}/dist
          -DGTI_PLATFORM=${{ matrix.platform }}
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID=${{ github.sha }}
          -P cmake/PackageRelease.cmake

      - name: Upload nightly archive
        uses: actions/upload-artifact@v7
        with:
          name: gti-nightly-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish nightly release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Download nightly archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gti-nightly-*
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # BUILD_ID is published as its own small asset so an installed
          # toolchain can test whether it is current without downloading a
          # full platform archive.
          printf '%s\n' "${GITHUB_SHA}" > dist/BUILD_ID
          version="$(tr -d '[:space:]' < VERSION)"
          notes="Rolling build of \`main\`. Replaced on every commit; not a\
           supported release.

          - commit: \`${GITHUB_SHA}\`
          - version at build: \`${version}\`

          Use a versioned release for anything you need to stay put."
          # Move the tag first: the API ignores target_commitish for a tag that
          # already exists, so the release alone would keep pointing at the
          # commit that first created it.
          git push --force origin "HEAD:refs/tags/nightly"
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
            gh release edit nightly \
              --prerelease \
              --title "GTI nightly" \
              --notes "${notes}"
          else
            gh release create nightly dist/* \
              --prerelease \
              --title "GTI nightly" \
              --notes "${notes}"
          fi

name: Suite measures

# The test-suite redesign's yardsticks (docs/plans/test-suite-redesign.md
# §11.4): Clang source coverage of the complete Linux suite, and the
# seeded-bug kill rate of the per-commit gate tier. They measure whether
# converting tests loses assurance. They run only by dispatch or weekly, write
# artifacts, and never gate main, tip, nightly, the slow tier or the release
# train; a failure here opens no issue. See docs/architecture/verification.md
# "Suite yardsticks".
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      measure:
        description: Which measure to run
        required: false
        default: both
        type: choice
        options: [both, coverage, seeded-bugs]
      mutants:
        description: Seeded mutants in the whole sample, run as eight slices of one hosted job each
        required: false
        default: "180"
        type: string
      seed:
        description: Seed of the mutant sample
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: suite-measures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Measure plan
    if: github.repository == 'lang-gti-official/gti'
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.plan.outputs.coverage }}
      seeded: ${{ steps.plan.outputs.seeded }}
      mutants: ${{ steps.plan.outputs.mutants }}
      seed: ${{ steps.plan.outputs.seed }}
    steps:
      - name: Choose the measures
        id: plan
        env:
          GTI_MEASURE: ${{ inputs.measure }}
          GTI_MUTANTS: ${{ inputs.mutants }}
          GTI_SEED: ${{ inputs.seed }}
        run: |
          measure="${GTI_MEASURE:-both}"
          mutants="${GTI_MUTANTS:-180}"
          seed="${GTI_SEED:-1}"
          case "${measure}" in both|coverage|seeded-bugs) ;; *) echo "unknown measure ${measure}" >&2; exit 1 ;; esac
          [[ "${mutants}" =~ ^[1-9][0-9]{0,3}$ && "${seed}" =~ ^[0-9]{1,9}$ ]] || { echo "bad mutants/seed" >&2; exit 1; }
          {
            [[ "${measure}" != seeded-bugs ]] && echo coverage=true || echo coverage=false
            [[ "${measure}" != coverage ]] && echo seeded=true || echo seeded=false
            echo "mutants=${mutants}"
            echo "seed=${seed}"
          } >> "${GITHUB_OUTPUT}"

  coverage:
    # Each shard builds the instrumented tree cold (an instrumented build has
    # no cache to share), then runs its part of every test set; instrumented
    # tests run slower, so the timeout scale is 6 and eight shards keep the
    # test step near two hours. Failing tests do not stop the measurement.
    name: Coverage shard (${{ matrix.index }}/8)
    needs: [plan]
    if: needs.plan.outputs.coverage == 'true'
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free hosted runner disk for the instrumented tree
        run: bash scripts/free_ci_disk.sh
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 3072
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed toolchain with its coverage Clang
        env:
          GTI_CI_COVERAGE: 1
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure the instrumented build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_SOURCE_COVERAGE=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
          -DGTI_TEST_TIMEOUT_SCALE=6
          -DCMAKE_JOB_POOLS=link=2 -DCMAKE_JOB_POOL_LINK=link
      - name: Build
        timeout-minutes: 150
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/build-profiles/%m.profraw
        run: cmake --build build --parallel "${GTI_JOBS}"
      - name: Run this shard of every test set
        # The shard runner's sets that make up the complete Linux suite: `full`
        # always, `slow` and `o3` once the runner defines them.
        timeout-minutes: 180
        continue-on-error: true
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/profiles/%m.profraw
          GTI_SHARD_INDEX: ${{ matrix.index }}
        run: |
          out="${RUNNER_TEMP}/coverage"
          mkdir -p "${out}" "${RUNNER_TEMP}/profiles"
          sets="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import validation_checks as v; print(" ".join(s for s in ("full", "slow", "o3") if s in v.TEST_SETS))')"
          for test_set in ${sets}; do
            if python3 scripts/validation_checks.py shard --build build --test-set "${test_set}" \
                 --shards 8 --index "${GTI_SHARD_INDEX}" --jobs "${GTI_TEST_JOBS}" \
                 --report "${out}/shard-${GTI_SHARD_INDEX}-${test_set}.json" \
                 --log "${RUNNER_TEMP}/shard-${GTI_SHARD_INDEX}-${test_set}.log"; then
              result=passed
            else
              result=failed
              tail -n 60 "${RUNNER_TEMP}/shard-${GTI_SHARD_INDEX}-${test_set}.log" || true
            fi
            echo "${test_set} ${result}" | tee -a "${out}/shard-${GTI_SHARD_INDEX}-status.txt"
          done
      - name: Export this shard's coverage
        if: always()
        timeout-minutes: 30
        env:
          GTI_SHARD_INDEX: ${{ matrix.index }}
        run: >-
          python3 scripts/coverage_report.py collect --build build
          --profiles "${RUNNER_TEMP}/profiles" --jobs "${GTI_JOBS}"
          --output "${RUNNER_TEMP}/coverage/shard-${GTI_SHARD_INDEX}.lcov.gz"
      - name: Upload this shard's coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/coverage/
          retention-days: 7
          if-no-files-found: warn

  coverage-summary:
    name: Coverage summary
    needs: [plan, coverage]
    if: always() && needs.plan.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: Summarize per source file
        env:
          GTI_SHA: ${{ github.sha }}
          GTI_RUN_ID: ${{ github.run_id }}
        run: |
          shards="${RUNNER_TEMP}/shards"
          out="${RUNNER_TEMP}/suite-coverage"
          mkdir -p "${out}"
          found="$(find "${shards}" -name 'shard-*.lcov.gz' | wc -l)"
          cat "${shards}"/shard-*-status.txt > "${out}/test-status.txt" || true
          cp "${shards}"/shard-*.json "${out}/" 2>/dev/null || true
          status="$(sort "${out}/test-status.txt" | tr '\n' ';')"
          python3 scripts/coverage_report.py summarize --commit "${GTI_SHA}" \
            --output "${out}/coverage.json" --lcov-output "${out}/coverage.lcov.gz" \
            --meta "run=${GTI_RUN_ID}" --meta "shards=${found}/8" --meta "test_status=${status}" \
            "${shards}"/shard-*.lcov.gz | tee -a "${GITHUB_STEP_SUMMARY}"
          [[ "${found}" == 8 ]] || { echo "only ${found} of 8 shards exported coverage" >&2; exit 1; }
      - name: Compare with the committed baseline
        # Advisory: a DROP line is a file more than 2 points below the
        # baseline with no reason in tests/coverage_allow.txt; never fatal.
        if: always()
        run: |
          out="${RUNNER_TEMP}/suite-coverage"
          mkdir -p "${out}"
          python3 scripts/coverage_compare.py tests/coverage_baseline.json "${out}/coverage.json" \
            --allow tests/coverage_allow.txt > "${out}/compare.txt" || true
          tee -a "${GITHUB_STEP_SUMMARY}" < "${out}/compare.txt"
      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-coverage
          path: ${{ runner.temp }}/suite-coverage/
          retention-days: 90
          if-no-files-found: warn

  seeded-bugs:
    # The same configure as CI's fast job, so its object cache is warm. Each
    # slice builds the gate tier's targets, checks the unmutated tree passes,
    # then runs its share of the deterministic sample until the budget ends.
    name: Seeded bugs (${{ matrix.slice }}/8)
    needs: [plan]
    if: needs.plan.outputs.seeded == 'true'
    strategy:
      fail-fast: false
      matrix:
        slice: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GTI_MUTATION_LABELS: '^(feedback-fast|gti-test-ui)$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          GTI_MEMORY_PER_JOB_MIB: 2048
          GTI_MEMORY_PER_TEST_MIB: 3072
        run: bash scripts/configure_ci_resources.sh
      - name: Install the reviewed compiler, Ninja and LLVM
        run: bash scripts/configure_ci_toolchain.sh
      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/native
        run: bash scripts/configure_ci_cache.sh
      - name: Restore compiler object cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v2-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'scripts/configure_ci_toolchain.sh') }}
          restore-keys: |
            gti-ccache-v2-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF
      - name: Select the gate tier's targets
        run: |
          names="$(ctest --test-dir build -N -L "${GTI_MUTATION_LABELS}" | sed -n 's/^ *Test *#[0-9]*: //p' | paste -sd'|' -)"
          [[ -n "${names}" ]] || { echo "no tests carry ${GTI_MUTATION_LABELS}" >&2; exit 1; }
          targets="$(python3 scripts/validation_checks.py test-targets --build build --regex "^(${names})$")"
          echo "GTI_MUTATION_TARGETS=gti gti_lsp ${targets}" >> "${GITHUB_ENV}"
      - name: Run this slice of the seeded sample
        timeout-minutes: 320
        env:
          GTI_SLICE: ${{ matrix.slice }}
          GTI_MUTANTS: ${{ needs.plan.outputs.mutants }}
          GTI_SEED: ${{ needs.plan.outputs.seed }}
        run: |
          mkdir -p "${RUNNER_TEMP}/seeded"
          python3 scripts/seeded_bugs.py run --build build -n "${GTI_MUTANTS}" --seed "${GTI_SEED}" \
            --slice "${GTI_SLICE}/8" --ninja-targets "${GTI_MUTATION_TARGETS}" \
            --build-command "cmake --build build --parallel ${GTI_JOBS} --target ${GTI_MUTATION_TARGETS}" \
            --test-command "ctest --test-dir build --no-tests=error --stop-on-failure --output-on-failure --parallel ${GTI_TEST_JOBS} -L ${GTI_MUTATION_LABELS}" \
            --time-budget-minutes 250 --mutant-timeout-minutes 45 \
            --output "${RUNNER_TEMP}/seeded/slice-${GTI_SLICE}.json" --log "${RUNNER_TEMP}/seeded/slice-${GTI_SLICE}.log"
      - name: Compress the slice log
        if: always()
        run: gzip -9 "${RUNNER_TEMP}"/seeded/*.log || true
      - name: Upload this slice
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeded-bugs-slice-${{ matrix.slice }}
          path: ${{ runner.temp }}/seeded/
          retention-days: 7
          if-no-files-found: warn

  seeded-bugs-summary:
    name: Seeded-bug summary
    needs: [plan, seeded-bugs]
    if: always() && needs.plan.outputs.seeded == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the slices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seeded-bugs-slice-*
          merge-multiple: true
          path: ${{ runner.temp }}/slices
      - name: Merge the slices
        run: |
          mkdir -p "${RUNNER_TEMP}/seeded-bugs"
          python3 scripts/seeded_bugs.py merge "${RUNNER_TEMP}"/slices/slice-*.json \
            --output "${RUNNER_TEMP}/seeded-bugs/seeded-bugs.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Upload the seeded-bug result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeded-bugs
          path: ${{ runner.temp }}/seeded-bugs/
          retention-days: 90
          if-no-files-found: warn

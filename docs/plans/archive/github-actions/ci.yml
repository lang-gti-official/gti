# Archived workflow: historical hosting/configuration evidence, not active CI.
# Current workflows live under .github/workflows/ in lang-gti-official/gti.
# Do not restore old runner, dependency, sanitizer or publication policy from
# this record without reconciling current architecture and verification rules.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      compiler: ${{ steps.scope.outputs.compiler }}
      reference: ${{ steps.scope.outputs.reference }}
    steps:
      - name: Check out GTI
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        # Fail-open: any uncertainty about the diff, and any file outside the
        # known-inert prefixes, runs the full compiler matrix. Skipping is
        # only allowed when every changed file provably cannot affect the
        # compiler, so no breadth is lost by construction.
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}"; range="triple" ;;
            push)         base="${{ github.event.before }}"; range="double" ;;
            *)            base="" ;;
          esac
          if [[ -z "${base}" || "${base}" == 0000000000000000000000000000000000000000 ]] \
             || ! git cat-file -e "${base}" 2>/dev/null; then
            echo "no reliable diff base; running the full matrix"
            echo "compiler=true" >> "${GITHUB_OUTPUT}"
            echo "reference=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${range}" == "triple" ]]; then
            changed="$(git diff --name-only "${base}...${GITHUB_SHA}")"
          else
            changed="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
          fi
          printf 'changed files:\n%s\n' "${changed}"
          compiler=false
          reference=false
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            case "${file}" in
              reference/*) reference=true ;;
              docs/*|lua/*|plugin/*|.gitea/*|.claude/*|.codex/*|*.md) ;;
              *) compiler=true ;;
            esac
          done <<< "${changed}"
          if [[ "${compiler}" == true ]]; then
            reference=true
          fi
          echo "compiler=${compiler}" >> "${GITHUB_OUTPUT}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install pinned clang-format
        run: |
          python3 -m venv .format-tools
          .format-tools/bin/pip install "clang-format==$(cat .clang-format-version)"

      - name: Verify first-party C and C++ formatting
        env:
          GTI_CLANG_FORMAT: .format-tools/bin/clang-format
        run: python3 scripts/clang_format.py --check

  release-version:
    name: Release version
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped tooling changes
        env:
          GTI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${GTI_BASE_SHA}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_release_version.py "${base}" "${GITHUB_SHA}"

  tree-sitter:
    name: Tree-sitter grammar
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install grammar tooling
        run: npm ci
        working-directory: tree-sitter-gti

      - name: Verify generated parser and corpus
        working-directory: tree-sitter-gti
        run: |
          npm run generate
          npm test
          npm run test:highlights
          npm run test:shipped
          npm run test:source-text
          git diff --exit-code -- src

  reference:
    name: Reference site
    needs: change-scope
    if: needs.change-scope.outputs.reference == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Install Ninja, LLVM 18, libclang, and Clang
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang libclang-18-dev llvm-18-dev ninja-build
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Configure reference tools
        run: >-
          cmake -S . -B build-reference -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_BUILD_LSP=OFF
          -DBUILD_TESTING=OFF

      - name: Build compiler-backed reference tools
        run: >-
          cmake --build build-reference --config Release --parallel 4
          --target gti_docgen gti

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.23.0
          runtime: node@24
          cache: true
          cache-dependency-path: reference/pnpm-lock.yaml
          package-json-file: reference/package.json
          install: false

      - name: Install reference dependencies
        working-directory: reference
        run: pnpm install --frozen-lockfile

      - name: Generate compiler API index
        working-directory: reference
        run: pnpm api:generate -- --docgen ../build-reference/gti_docgen

      - name: Verify content contract and examples
        working-directory: reference
        run: |
          pnpm test
          pnpm examples:verify -- --gti ../build-reference/gti
          pnpm examples:contract-smoke -- --gti ../build-reference/gti

      - name: Build static reference
        working-directory: reference
        run: |
          pnpm typecheck
          pnpm build

  build-and-test:
    name: ${{ matrix.platform }}
    needs: change-scope
    if: needs.change-scope.outputs.compiler == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Ninja and LLVM 18
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build llvm-18-dev libclang-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Install Ninja and LLVM 22
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: >-
          ctest --test-dir build -C Release
          --parallel 4 --output-on-failure

      - name: Stage system-LLVM toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${{ runner.temp }}/gti-system-stage"
          --component gti_toolchain

      - name: Test installed libraries with system LLVM
        run: |
          cmake \
            -S tests/installed_library_smoke \
            -B "${{ runner.temp }}/gti-system-library-smoke" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gti-system-stage"
          cmake --build \
            "${{ runner.temp }}/gti-system-library-smoke" \
            --config Release
          ctest \
            --test-dir "${{ runner.temp }}/gti-system-library-smoke" \
            -C Release --parallel 4 --output-on-failure

  compiler-sanitizers:
    name: Compiler sanitizers
    needs: change-scope
    if: needs.change-scope.outputs.compiler == 'true'
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out GTI
        uses: actions/checkout@v6

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Ninja and LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build llvm-18-dev libclang-18-dev
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "${GITHUB_ENV}"

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGTI_BUILD_LSP=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitized --parallel 4

      - name: Test compiler and driver libraries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir build-sanitized --output-on-failure
          --parallel 4
          -R 'compiler_library_boundary|driver_library_boundary|driver_pipeline|project_model|compiler_pipeline|optimizer_foundation|raw_pointer_pipeline|failure_metadata|mir_program_initialization|mir_hosted_startup|mir_backend_first_family$|mir_backend_scalar_cfg$|mir_backend_scalar_direct_call$|mir_backend_class_default_cleanup$|mir_backend_owned_lifecycle$|mir_backend_scalar_failure_callgraph$|cpp_mir_body_emitter|cpp_mir_program_plan|cpp_mir_representation_snapshot'

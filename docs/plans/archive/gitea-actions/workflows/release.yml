name: Toolchain release

# One bundled build per main commit supplies nightly and, on VERSION changes,
# stable. Manual dispatch retains the exact-commit stable rebuild contract.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: toolchain-${{ gitea.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}

    steps:
      - name: Check out GTI
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ gitea.sha }}

      - name: Verify release orchestration before compiling
        run: python3 tests/ci_release_test.py .

      - name: Resolve exact source and release channels
        id: release
        shell: bash
        env:
          GTI_EVENT_SHA: ${{ gitea.sha }}
          GTI_EVENT_NAME: ${{ gitea.event_name }}
          GTI_EVENT_BEFORE: ${{ gitea.event.before }}
        run: >-
          python3 scripts/resolve_release_source.py source
          --sha "${GTI_EVENT_SHA}" --event "${GTI_EVENT_NAME}"
          --before "${GTI_EVENT_BEFORE}" --output "${GITEA_OUTPUT}"

  package:
    name: Build and test shared release toolchain
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact release commit
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Configure runner resources
        shell: bash
        env:
          GTI_CONFIGURED_JOBS: ${{ vars.GTI_JOBS }}
          GTI_CONFIGURED_TEST_JOBS: ${{ vars.GTI_TEST_JOBS }}
          # The bundled LLVM/Clang build compiles its large units beside
          # GTI's; running one per processor exhausted the runner's memory.
          GTI_MEMORY_PER_JOB_MIB: 3072
        run: bash scripts/configure_ci_resources.sh

      - name: Install Linux build dependencies, Ninja, and Clang
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt=(apt-get)
          if command -v sudo >/dev/null 2>&1; then
            apt=(sudo apt-get)
          fi
          "${apt[@]}" update
          "${apt[@]}" install -y --no-install-recommends \
            build-essential ccache clang cmake ninja-build libcurl4-openssl-dev

      - name: Install CMake and Ninja
        if: runner.os == 'macOS'
        run: brew install ccache cmake ninja

      - name: Configure compiler object cache
        env:
          GTI_CACHE_DIRECTORY: ${{ runner.temp }}/gti-ccache/release
        run: bash scripts/configure_ci_cache.sh

      - name: Restore compiler and LLVM/Clang object cache
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: https://gitea.com/actions/cache/restore@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2 # v4.1.0, cache service v1
        with:
          path: ${{ env.CCACHE_DIR }}
          key: gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ gitea.sha }}-${{ gitea.run_id }}
          restore-keys: |
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            gti-ccache-v1-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Resolve package platform
        id: platform
        shell: bash
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux-x64 ;;
            Linux-ARM64) platform=linux-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            *)
              echo "Unsupported release runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          echo "platform=${platform}" >> "${GITEA_OUTPUT}"

      - name: Check runner sanitizer execution
        run: python3 scripts/check_ci_sanitizers.py --sanitizer address,undefined

      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTI_RELEASE_BUILD=ON
          -DGTI_ENABLE_THREAD_SANITIZER_TESTS=OFF

      - name: Check native driver compilation before LLVM/Clang
        run: >-
          cmake --build build --config Release --parallel "${GTI_JOBS}"
          --target CMakeFiles/gti_driver.dir/src/driver/build.cpp.o

      - name: Build
        run: cmake --build build --config Release --parallel "${GTI_JOBS}"

      - name: Test build tree
        run: >-
          ctest --test-dir build -C Release
          --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Allocate a fresh staging directory
        env:
          GTI_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          stage="$(mktemp -d "${GTI_RUNNER_TEMP}/gti-stage.XXXXXXXX")"
          printf 'GTI_STAGE_DIRECTORY=%s\n' "${stage}" >> "${GITEA_ENV}"

      - name: Stage toolchain
        run: >-
          cmake --install build --config Release
          --prefix "${GTI_STAGE_DIRECTORY}"
          --component gti_toolchain

      - name: Test installed toolchain
        run: |
          export PATH="${GTI_STAGE_DIRECTORY}/bin:${PATH}"
          cd "${{ runner.temp }}"
          python3 "${{ gitea.workspace }}/tests/lsp_smoke_test.py" gti_lsp
          python3 "${{ gitea.workspace }}/tests/cli_smoke_test.py" gti
          python3 "${{ gitea.workspace }}/tests/project_cli_smoke_test.py" gti
          python3 "${{ gitea.workspace }}/tests/process_resource_policy_test.py" gti --installed
          python3 "${{ gitea.workspace }}/tests/managed_thread_runtime_test.py" gti
          python3 "${{ gitea.workspace }}/tests/atomic_runtime_test.py" gti \
            "${{ gitea.workspace }}/tests/fixtures/atomic_scalar.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_concurrent.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_orders.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_fetch.gti" \
            "${{ gitea.workspace }}/tests/fixtures/atomic_fetch_overflow.gti"
          cmake \
            -S "${{ gitea.workspace }}/tests/installed_library_smoke" \
            -B "${{ runner.temp }}/gti-installed-library-smoke" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GTI_STAGE_DIRECTORY}"
          cmake --build \
            "${{ runner.temp }}/gti-installed-library-smoke" \
            --config Release --parallel "${GTI_JOBS}"
          ctest \
            --test-dir "${{ runner.temp }}/gti-installed-library-smoke" \
            -C Release --parallel "${GTI_TEST_JOBS}" --output-on-failure

      - name: Create release archive
        if: needs.metadata.outputs.stable == 'true'
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ gitea.workspace }}
          -DGTI_STAGE_DIR=${{ env.GTI_STAGE_DIRECTORY }}
          -DGTI_OUTPUT_DIR=${{ gitea.workspace }}/dist/stable
          -DGTI_PLATFORM=${{ steps.platform.outputs.platform }}
          -DGTI_EXPECTED_TAG=${{ needs.metadata.outputs.tag }}
          -P cmake/PackageRelease.cmake

      - name: Upload release archive
        if: needs.metadata.outputs.stable == 'true'
        uses: https://gitea.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: gti-release-package
          path: dist/stable/*
          if-no-files-found: error
          retention-days: 1

      # Stable is archived first; only nightly stamps BUILD_ID into the stage.
      - name: Create nightly archive from the same validated stage
        run: >-
          cmake
          -DGTI_SOURCE_DIR=${{ gitea.workspace }}
          -DGTI_STAGE_DIR=${{ env.GTI_STAGE_DIRECTORY }}
          -DGTI_OUTPUT_DIR=${{ gitea.workspace }}/dist/nightly
          -DGTI_PLATFORM=${{ steps.platform.outputs.platform }}
          -DGTI_CHANNEL=nightly
          -DGTI_EXPECTED_TAG=nightly
          -DGTI_BUILD_ID=${{ needs.metadata.outputs.sha }}
          -P cmake/PackageRelease.cmake

      - name: Record nightly build identity
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: printf '%s\n' "${GTI_NIGHTLY_SHA}" > dist/nightly/BUILD_ID

      - name: Upload nightly archive
        uses: https://gitea.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: gti-nightly-package
          path: dist/nightly/*
          if-no-files-found: error
          retention-days: 1

      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi

      - name: Save compiler and LLVM/Clang cache, including partial builds
        if: always() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: https://gitea.com/actions/cache/save@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  publish-stable:
    name: Publish Gitea release
    if: needs.metadata.outputs.stable == 'true'
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    permissions:
      code: write
      releases: write

    steps:
      - name: Check out packaged commit
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Refuse a conflicting release tag
        shell: bash
        env:
          GTI_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          GTI_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${GTI_RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "+refs/tags/${GTI_RELEASE_TAG}:refs/tags/${GTI_RELEASE_TAG}"
            current="$(git rev-parse "refs/tags/${GTI_RELEASE_TAG}^{commit}")"
            if [[ "${current}" != "${GTI_RELEASE_SHA}" ]]; then
              echo "${GTI_RELEASE_TAG} names ${current}; refusing mismatched artifacts" >&2
              exit 1
            fi
          fi

      - name: Download release archive
        uses: https://gitea.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: gti-release-package
          path: dist

      - name: Verify downloaded assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

      - name: Publish release
        uses: https://gitea.com/actions/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.sha }}
          name: GTI ${{ needs.metadata.outputs.tag }}
          prerelease: false
          body: |
            Stable GTI toolchain built from `${{ needs.metadata.outputs.sha }}`.

            This immutable release is published by the authoritative Gitea workflow.
          files: |
            dist/*

  publish-nightly:
    name: Publish Gitea nightly release
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    concurrency:
      group: gti-nightly-publication
      cancel-in-progress: false
    permissions:
      code: write
      releases: write

    steps:
      - name: Check out packaged commit
        uses: https://gitea.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Download nightly archive
        uses: https://gitea.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a
        with:
          name: gti-nightly-package
          path: dist

      - name: Verify downloaded assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No nightly assets were downloaded" >&2
            exit 1
          fi

      - name: Admit only the current main commit
        id: admission
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: >-
          python3 scripts/resolve_release_source.py admit-nightly
          --sha "${GTI_NIGHTLY_SHA}" --output "${GITEA_OUTPUT}"

      - name: Advance the nightly tag
        if: steps.admission.outputs.publish == 'true'
        shell: bash
        env:
          GTI_NIGHTLY_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          git tag --force nightly "${GTI_NIGHTLY_SHA}"
          git push --force origin refs/tags/nightly

      - name: Publish nightly release
        if: steps.admission.outputs.publish == 'true'
        uses: https://gitea.com/actions/gitea-release-action@5a83c90484ef4355121df5eb60558c8ce66e81ac # v1
        with:
          server_url: ${{ gitea.server_url }}
          repository: ${{ gitea.repository }}
          token: ${{ gitea.token }}
          tag_name: nightly
          target_commitish: ${{ needs.metadata.outputs.sha }}
          name: GTI nightly
          prerelease: true
          body: |
            Rolling build of Gitea `main`.

            - commit: `${{ needs.metadata.outputs.sha }}`
            - version at build: `${{ needs.metadata.outputs.version }}`

            Use a versioned release for anything that needs to stay put.
          files: |
            dist/*

      - name: Remove assets outside this nightly build
        if: steps.admission.outputs.publish == 'true'
        env:
          GTI_GITEA_TOKEN: ${{ gitea.token }}
        run: >-
          python3 scripts/sync_gitea_release_assets.py
          --api-url "${{ gitea.api_url }}"
          --repository "${{ gitea.repository }}"
          --tag nightly
          --asset-directory dist

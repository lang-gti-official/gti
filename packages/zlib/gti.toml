manifest-version = 1

[package]
name = "gti-zlib"
version = "0.1.0"

[package.native]
include-dirs = ["vendor/zlib"]
c-sources = [
  "vendor/zlib/adler32.c", "vendor/zlib/compress.c", "vendor/zlib/crc32.c",
  "vendor/zlib/deflate.c", "vendor/zlib/infback.c", "vendor/zlib/inffast.c",
  "vendor/zlib/inflate.c", "vendor/zlib/inftrees.c", "vendor/zlib/trees.c",
  "vendor/zlib/uncompr.c", "vendor/zlib/zutil.c"
]

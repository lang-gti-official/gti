manifest-version = 1

[package]
name = "gti-libgit2"
version = "0.1.0"

[package.build-script]
source = "build.gti"
inputs = ["vendor/libgit2", "vendor/zlib"]

[dependencies]
zlib = { path = "../zlib" }

[package.native]
include-dirs = ["native", "vendor/libgit2/include"]
c-sources = ["native/adapter.c"]
